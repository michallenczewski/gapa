name: Buduj instalatory

# Instalatory budują się tylko przy nowej wersji: gdy w package.json pojawi się
# numer, dla którego nie ma jeszcze wydania. Ręcznie: Actions → Buduj instalatory → Run workflow.
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'web/**', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! gh release view "v$V" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "Buduję wersję $V"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "Wydanie v$V już istnieje — pomijam budowanie"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Mac budujemy na maszynie z Intelem — tych GitHub ma więcej; dmg i tak powstaje dla arm64 i x64
        os: [macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # na maszynach GitHuba XProtect potrafi trzymać obraz dysku i hdiutil nie może go odłączyć
      - name: Zatrzymaj XProtect
        if: runner.os == 'macOS'
        run: sudo pkill -9 XProtect >/dev/null 2>&1 || true; while pgrep XProtect >/dev/null; do sleep 2; done
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # każdy system dokłada swój instalator do wydania od razu, bez czekania na drugi
      - name: Dołącz do wydania
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Podgląd ${{ needs.check.outputs.version }}
          make_latest: true
          files: |
            dist/*.dmg
            dist/*.exe
          fail_on_unmatched_files: false
