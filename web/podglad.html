<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Podgląd (wersja w przeglądarce)</title>
<style>
/* ===== Podgląd — wygląd „A”: jeden cienki pasek, panel informacji na żądanie ===== */
:root{
  --bg:#f7f7f5; --text:#1a1a19; --text2:#4a4945; --muted:#8a8984; --muted2:#a3a29d;
  --soft:#efeeea; --hover:#ecebe7; --line:#e6e5e1; --card:#ffffff; --cardline:#ecebe7;
  --ring:#1a1a19; --pill:#ffffff; --pillsh:0 1px 2px rgba(0,0,0,.08); --tip:#1a1a19; --tiptext:#f7f7f5;
  --menu:#ffffff; --menush:0 0 0 1px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.10); --kbd:#f3f2ef;
  --stage:#f7f7f5; --tile-w:180px; --lic:28px; color-scheme:light;
}
[data-theme=dark]{
  --bg:#161616; --text:#e9e9e7; --text2:#c4c4c1; --muted:#8d8d89; --muted2:#6f6f6c;
  --soft:#222221; --hover:#242423; --line:#2a2a29; --card:#1d1d1c; --cardline:#2a2a29;
  --ring:#e9e9e7; --pill:#363635; --pillsh:0 1px 2px rgba(0,0,0,.4); --tip:#e9e9e7; --tiptext:#161616;
  --menu:#232322; --menush:0 0 0 1px rgba(255,255,255,.07),0 12px 36px rgba(0,0,0,.5); --kbd:#2e2e2d;
  --stage:#161616; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:52px minmax(0,1fr);height:100vh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}
main:focus-visible{outline:none}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* --- pasek górny --- */
header{grid-column:1/4;display:flex;align-items:center;gap:6px;padding:0 12px;min-width:0;overflow:hidden}

.ib{width:30px;height:30px;border-radius:7px;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.ib:hover:not(:disabled){background:var(--hover);color:var(--text)}
.ib[aria-pressed=true]{background:var(--soft);color:var(--text)}
#crumbs{display:flex;align-items:center;min-width:0;margin:0 0 0 4px;font-size:13px;font-weight:400;white-space:nowrap;overflow:hidden;flex:0 1 auto}
#crumbs a{color:var(--muted);padding:4px 6px;border-radius:6px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:28px}
#crumbs a:hover{color:var(--text);background:var(--hover)}
#crumbs i{font-style:normal;color:var(--muted2);opacity:.6;flex:none}
#crumbs span{font-weight:500;padding:4px 6px;flex:none}
#count{color:var(--muted2);font-size:12px;white-space:nowrap;flex:none;margin-left:2px}
#hspace{flex:none;width:calc(220px - 40px)}
/* okno bez paska tytułu: miejsce na przyciski systemu, przeciąganie za górny pasek */
.frame-win header,.frame-win #viewer .top{padding-right:150px}
.frame-mac header{padding-left:84px}
.frame-mac #viewer .top{padding-left:84px}
.frame-mac #hspace{width:calc(220px - 112px)}
.frame-win header,.frame-mac header,.frame-win #viewer .top,.frame-mac #viewer .top{-webkit-app-region:drag}
header button,header input,header a,header .seg,header .zoom,header .search,#viewer .top button{-webkit-app-region:no-drag}
body.noside #hspace{display:none}
.sechead{display:flex;align-items:center;flex:none}
.sechead .sec{flex:1}
.addfav{width:20px;height:20px;border-radius:5px;color:var(--muted2);display:flex;align-items:center;justify-content:center;margin:8px 4px 0 0;opacity:0;transition:opacity .15s}
aside:hover .addfav:not(:disabled),.addfav:focus-visible{opacity:1}
.addfav:hover{background:var(--hover);color:var(--text)}
.addfav.on{display:none}
#deepChip{height:26px;padding:0 10px;border-radius:7px;background:var(--soft);font-size:12px;flex:none;color:var(--text2)}
#deepChip:hover{background:var(--hover);color:var(--text)}
.gap{flex:1 1 0;min-width:8px}
.search{display:flex;align-items:center;gap:8px;height:30px;width:220px;padding:0 4px 0 10px;border-radius:8px;background:var(--soft);color:var(--muted);flex:none}
.search:focus-within{box-shadow:0 0 0 1px var(--line)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font:inherit;color:var(--text);padding:0}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
#qClear{color:var(--muted);font-size:14px;padding:0 2px}
#qClear:hover{color:var(--text)}
#qScope{height:22px;padding:0 8px;border-radius:6px;font-size:11px;color:var(--muted);flex:none}
#qScope:hover{color:var(--text)}
#qScope[aria-pressed=true]{background:var(--pill);box-shadow:var(--pillsh);color:var(--text)}
.sep{width:1px;height:16px;background:var(--line);margin:0 6px;flex:none}
.tb{height:30px;padding:0 8px;border-radius:7px;color:var(--text2);display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.tb:hover,.tb.open{background:var(--hover);color:var(--text)}
.tb.on{color:var(--text);background:var(--soft)}
.tb svg{color:var(--muted)}
.zoom{display:flex;align-items:center;width:112px;padding:0 4px;flex:none}
.zoom input{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;cursor:pointer}
.zoom input::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:linear-gradient(90deg,var(--text) var(--p,40%),var(--line) var(--p,40%))}
.zoom input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.14)}
.seg{display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--soft);flex:none;margin-left:6px}
.seg button{width:28px;height:26px;border-radius:6px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:var(--pill);box-shadow:var(--pillsh);color:var(--text)}

/* --- pasek boczny --- */
aside{grid-row:2;grid-column:1;width:220px;padding:6px 10px 12px 12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
body.noside aside{display:none}
.sec{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted2);padding:14px 10px 6px;width:100%;text-align:left;flex:none}
.sec:first-child{padding-top:6px}
.sec:hover{color:var(--muted)}
.sec svg{transition:transform .15s}
.sec.shut svg{transform:rotate(-90deg)}
.nav{list-style:none;margin:0;padding:0;flex:none}
.nav li{display:flex;align-items:center;gap:4px;padding:5px 8px 5px 10px;border-radius:7px;color:var(--text2);cursor:pointer;min-width:0}
.nav li:hover{background:var(--hover);color:var(--text)}
.nav li.on{background:var(--hover);color:var(--text);font-weight:500}
.nav li span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav li span.nm{flex:1}
.nav li .x{opacity:0;color:var(--muted);flex:none;width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px}
.nav li:hover .x{opacity:1}
.nav li .x:hover{background:var(--soft);color:var(--text)}
.nav li.none{color:var(--muted2);cursor:default;font-size:12px}
.nav li.none:hover{background:none}
.tree{flex:0 1 auto;overflow:auto;min-height:0}
.tree.shut,.nav.shut{display:none}
.tree li{position:relative}
.tree li .g{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.tw{flex:none;width:14px;height:14px;display:flex;align-items:center;justify-content:center;color:var(--muted2);border-radius:3px}
.tw:hover{color:var(--text)}
.tw svg{transition:transform .12s}
.tw.open svg{transform:rotate(90deg)}
.foot{flex:none;display:flex;align-items:center;gap:6px;margin-top:auto;padding:12px 4px 0 10px}
#cache{flex:1;font-size:11px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{font-size:11px;color:var(--muted);white-space:nowrap}

/* --- siatka --- */
main{grid-row:2;grid-column:2;overflow:auto;padding:10px 24px 32px 24px;position:relative;outline:none;min-width:0}
#grid.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(var(--tile-w),100%),1fr));column-gap:calc(var(--tile-w)*.15);row-gap:calc(var(--tile-w)*.1)}
#grid.list{display:block}
.tile{display:flex;flex-direction:column;gap:8px;min-width:0;cursor:default}
.tile .box{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;position:relative}
.tile .dur{position:absolute;right:6px;bottom:6px;display:flex;align-items:center;gap:5px;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-variant-numeric:tabular-nums;line-height:15px;pointer-events:none}
#stage video.vid{cursor:default;outline:none;border-radius:4px}
#stage.fit>video.vid{position:relative;inset:auto;margin:auto;width:auto;height:auto;max-width:calc(100% - 128px);max-height:calc(100% - 38px);transform:translateY(-5px)}
.tile:not(.dir) canvas{max-width:100%;max-height:100%;width:auto;height:auto;display:block;border-radius:3px;transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s}
.tile:not(.dir):hover canvas{transform:scale(1.04);box-shadow:0 8px 24px rgba(0,0,0,.14)}
.tile.sel:not(.dir) canvas{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ring)}
.tile.sel:not(.dir):hover canvas{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ring),0 8px 24px rgba(0,0,0,.14)}
.tile .nm{display:block;font-size:12px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.sel .nm{color:var(--text)}
.tile .sub{display:none}
.tile .ph{color:var(--muted2);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.tile:not(.dir) .box:has(.ph){background:var(--soft);border-radius:6px}
body.nonames .tile:not(.dir) .nm{display:none}
/* folder: kadr z zaokrągleniem i etykietą z liczbą obrazów */
.tile.dir .box{border-radius:10px;background:var(--soft);overflow:hidden;transition:box-shadow .18s}
.tile.dir .box canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .25s cubic-bezier(.2,.7,.3,1)}
.tile.dir:hover .box canvas{transform:scale(1.03)}
.tile.dir.sel .box{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ring)}
.tile.dir .nm{color:var(--text);font-weight:500}
.tile.dir .ph{font-size:0}
.tile.dir .ph svg{width:24px;height:24px;color:var(--muted2)}
.chip{position:absolute;left:8px;bottom:8px;height:22px;padding:0 8px;border-radius:6px;background:rgba(255,255,255,.88);color:#4a4945;font-size:11px;display:flex;align-items:center;gap:5px;z-index:2;font-variant-numeric:tabular-nums}
[data-theme=dark] .chip{background:rgba(22,22,22,.78);color:#d0d0cd}
.sk{position:absolute;left:10px;right:10px;bottom:8px;display:flex;gap:3px;height:2px;opacity:0;transition:opacity .15s;z-index:2}
.sk i{flex:1;background:rgba(255,255,255,.4);border-radius:1px}
.sk i.on{background:#fff}
.cnt{position:absolute;right:8px;top:8px;font-size:10px;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.5);color:#fff;font-variant-numeric:tabular-nums;opacity:0;z-index:2;pointer-events:none}
.tile.dir .box:hover .sk,.tile.dir .box:hover .cnt{opacity:1}
.tile.dir .box:hover .chip{opacity:0}
/* nagłówki podfolderów w trybie „wszystko w środku” */
div.grp{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;padding:22px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:12px;color:var(--muted2)}
div.grp:first-child{padding-top:4px}
.grp b{color:var(--text);font-weight:500;font-size:13px;cursor:pointer}
.grp b:hover{text-decoration:underline;text-underline-offset:3px}
tr.grp td{padding:20px 8px 6px;background:none!important;color:var(--muted2);font-size:12px}
tr.grp td b{margin-right:10px}

/* lista */
.list{width:100%;border-collapse:collapse}
.list th{font-weight:400;font-size:11px;color:var(--muted2);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.list th button{color:inherit}
.list th button:hover,.list th.on button{color:var(--text)}
.list td{padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.list td.num,.list th.num{text-align:right;font-variant-numeric:tabular-nums}
.list td.m{color:var(--muted)}
.list tbody tr:not(.grp):hover td{background:var(--hover)}
.list tr.sel td{background:var(--soft)}
.list tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--ring)}
.list .cell{display:flex;align-items:center;min-width:0}
.list .ic{flex:none;width:calc(var(--lic)*4/3);height:var(--lic);margin-right:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:3px}
.list .ic canvas{max-width:100%;max-height:100%;display:block;border-radius:2px}
.list .nm{overflow:hidden;text-overflow:ellipsis}

#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted);text-align:center;padding:20px;font-size:13px;line-height:1.6}
#empty small{color:var(--muted2);font-size:11px;letter-spacing:.02em}
.btn{height:32px;padding:0 14px;border-radius:8px;background:var(--text);color:var(--bg);font-weight:500}
.btn:hover{opacity:.88}

/* --- panel informacji (I) --- */
#insp{grid-row:2;grid-column:3;width:300px;margin:0 12px 12px 0;padding:16px;background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--cardline);display:flex;flex-direction:column;gap:16px;overflow:auto;min-height:0}
body:not(.insp) #insp{display:none}
#iprev{aspect-ratio:16/10;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--soft);overflow:hidden;flex:none}
#iprev canvas{max-width:100%;max-height:100%;display:block}
#iprev.has{background:transparent}
#iname{font-weight:600;font-size:14px;word-break:break-word}
#ipath{color:var(--muted);font-size:12px;margin-top:3px;word-break:break-word}
#imeta{margin:0;display:grid;grid-template-columns:88px 1fr;row-gap:8px;font-size:12px;font-variant-numeric:tabular-nums}
#imeta dt{color:var(--muted)}
#imeta dd{margin:0;word-break:break-word}
.hr{height:1px;background:var(--line);flex:none}
#iacts{display:flex;flex-direction:column;gap:2px}
.act{height:30px;border-radius:7px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:var(--text)}
.act:hover{background:var(--hover)}
.act.primary{height:32px;background:var(--text);color:var(--bg);font-weight:500;margin-bottom:6px}
.act.primary:hover{background:var(--text);opacity:.88}
.act span{color:var(--muted2);font-size:11px;font-weight:400}
.act.primary span{color:var(--muted)}
#ihint{color:var(--muted2);font-size:11px;margin-top:auto}

/* --- menu --- */
.ctx{position:fixed;z-index:60;min-width:200px;max-width:320px;background:var(--menu);border-radius:10px;padding:5px;box-shadow:var(--menush)}
.ctx[hidden]{display:none}
.ctx button{display:flex;align-items:center;gap:10px;width:100%;height:30px;text-align:left;padding:0 6px 0 9px;border-radius:6px;color:var(--text);white-space:nowrap}
.ctx button:hover,.ctx button:focus{background:var(--hover);outline:0}
.ctx button .l{flex:1;overflow:hidden;text-overflow:ellipsis}
.ctx button .c{width:12px;flex:none;color:var(--text)}
.ctx button .n{color:var(--muted2);font-size:12px;font-variant-numeric:tabular-nums}
.ctx .box{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1.2px var(--muted2);display:flex;align-items:center;justify-content:center;color:var(--bg)}
.ctx .box.on{background:var(--text);box-shadow:none}
.ctx kbd{font:inherit;font-size:11px;color:var(--muted);min-width:18px;height:18px;padding:0 5px;border-radius:4px;background:var(--kbd);display:inline-flex;align-items:center;justify-content:center}
.ctx .keys{display:flex;gap:3px}
.ctx hr{border:0;height:1px;background:var(--line);margin:5px 4px}
.ctx .ch{padding:6px 9px 4px;color:var(--muted);font-size:11px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tip{position:fixed;z-index:80;max-width:340px;padding:5px 9px;border-radius:6px;background:var(--menu);color:var(--text);box-shadow:var(--menush);font-size:12px;line-height:1.4;pointer-events:none;opacity:0;transform:translateY(-2px);transition:opacity .12s,transform .12s;overflow-wrap:anywhere}
.tip.on{opacity:1;transform:none}
.zoomtip{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(4px);background:var(--tip);color:var(--tiptext);padding:6px 11px;border-radius:7px;font-size:12px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:70}
.zoomtip.on{opacity:1;transform:translateX(-50%)}
.dropzone{display:none;position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 80%,transparent);pointer-events:none}
.dropzone span{position:absolute;inset:14px;border:1.5px dashed var(--muted);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
body[data-drop] .dropzone{display:block}

/* --- podgląd --- */
#viewer{position:fixed;inset:0;background:var(--stage);display:none;flex-direction:column;z-index:10}
#viewer.open{display:flex}
#viewer .top{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;padding:10px 12px 4px;white-space:nowrap}
#viewer .top .ib{color:var(--text2)}
.vt{text-align:center;min-width:0;line-height:1.35}
#vname{font-weight:500;overflow:hidden;text-overflow:ellipsis}
#vinfo{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis}
#vcount{color:var(--muted2);font-variant-numeric:tabular-nums;font-size:12px}
#stage{flex:1;overflow:auto;position:relative;display:flex}
#stage.fit>*{position:absolute;inset:14px 64px 24px;width:calc(100% - 128px);height:calc(100% - 38px);object-fit:scale-down;cursor:zoom-in}
#stage.fit>.low{margin:auto;object-fit:fill}
#stage.actual>*{margin:auto;flex:none;cursor:zoom-out}
#stage.fit>iframe.doc,#stage.actual>iframe.doc{position:absolute;inset:8px 64px 16px;width:calc(100% - 128px);height:calc(100% - 24px);border:0;border-radius:6px;background:#fff;margin:0;cursor:auto}
#stage.fit>canvas.docthumb{object-fit:contain;image-rendering:auto}
#stage .msg{margin:auto;color:var(--muted);position:static!important;width:auto!important;height:auto!important}
#viewer .navb{position:absolute;top:calc(50% - 28px);width:44px;height:56px;color:var(--muted);z-index:2;opacity:0;transition:opacity .2s;display:flex;align-items:center;justify-content:center}
#viewer:hover .navb{opacity:1}
#viewer .navb:hover{color:var(--text)}
#vprev{left:10px} #vnext{right:10px}

/* Tab: sam obraz, bez interfejsu */
body.bare{grid-template-columns:1fr;grid-template-rows:1fr}
body.bare aside,body.bare header,body.bare #insp,body.bare #viewer .top{display:none}
body.bare main{grid-row:1;grid-column:1}
body.bare #grid .nm{display:none}
.web .apponly{display:none}
.web.oneroot [data-sec=places],.web.oneroot #places{display:none}
/* węższe okno: najpierw znika suwak, potem nazwy przy sortowaniu, panel boczny i panel informacji chowają się same */
@media (max-width:1100px){.zoom,.sep{display:none}.search{width:170px}}
@media (max-width:860px){#hspace{display:none}#sortBtn span,#typesBtn span{display:none}#sortBtn,#typesBtn{padding:0 6px}.search{width:130px}#qScope{display:none}aside{display:none}}
@media (max-width:760px){#insp{display:none!important}#count{display:none}}
</style>
</head>
<body>

<header>
  <button id="sideBtn" class="ib" aria-label="Panel boczny" title="Panel boczny">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/></svg>
  </button>
  <span id="hspace" aria-hidden="true"></span>
  <nav id="crumbs" aria-label="Ścieżka"></nav>
  <span id="count" hidden></span>
  <button id="deepChip" hidden title="Wróć do zwykłego widoku folderu (W)">Wszystko w środku ✕</button>
  <span class="gap"></span>
  <label class="search">

<script>
/* Podgląd w przeglądarce: zastępuje most Electronu (preload.js).
   Foldery otwierane przez File System Access API (Chrome/Edge), miniatury w IndexedDB.
   Ścieżki są wirtualne: /<nazwa folderu>/podfolder/plik. */
(()=>{
  if(window.api) return;
  const handles=new Map();   // ścieżka → uchwyt folderu lub pliku
  const files=new Map();     // ścieżka → File
  const urls=new Map();      // ścieżka → blob: URL
  let roots=[];              // [{name,path,handle}]
  let tip=null;
  const say=t=>{ if(typeof zoomTip==='function') zoomTip(t); };
  const onlyApp=()=>say('Dostępne w programie Podgląd');

  const db=new Promise((res,rej)=>{const r=indexedDB.open('podglad-web',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('roots',{keyPath:'name'});d.createObjectStore('thumbs',{keyPath:'k'}).createIndex('t','t');};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
  const tx=async(store,mode,fn)=>{const d=await db;return new Promise((res,rej)=>{const t=d.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});};

  const dirname=p=>{const s=p.replace(/\/+$/,'');const i=s.lastIndexOf('/');return i<=0?'/':s.slice(0,i);};
  const basename=p=>p.replace(/\/+$/,'').split('/').pop()||'/';
  const join=(a,b)=>a.replace(/\/+$/,'')+'/'+b;

  async function permitted(h,ask){
    try{ let p=await h.queryPermission({mode:'read'}); if(p!=='granted'&&ask) p=await h.requestPermission({mode:'read'}); return p==='granted'; }catch(e){ return true; }
  }
  async function loadRoots(){
    try{ const rs=await tx('roots','readonly',s=>s.getAll())||[]; for(const r of rs){ const p='/'+r.name; if(!roots.find(x=>x.path===p)){ roots.push({name:r.name,path:p,handle:r.handle}); handles.set(p,r.handle);} } }catch(e){}
  }
  async function addRoot(h){
    for(const r of roots){ try{ if(await r.handle.isSameEntry(h)) return r.path; }catch(e){} }
    let name=h.name, k=2; while(roots.find(r=>r.name===name)) name=h.name+' ('+(k++)+')';
    const p='/'+name; roots.push({name,path:p,handle:h}); handles.set(p,h);
    tx('roots','readwrite',s=>s.put({name,handle:h})).catch(()=>{});
    return p;
  }
  // uchwyt dla ścieżki: korzeń + kolejne podfoldery
  async function resolve(p,ask){
    if(handles.has(p)){ const h=handles.get(p); const r=roots.find(x=>p===x.path||p.startsWith(x.path+'/')); if(r&&!(await permitted(r.handle,ask))) return null; return h; }
    const r=roots.find(x=>p===x.path||p.startsWith(x.path+'/')); if(!r) return null;
    if(!(await permitted(r.handle,ask))) return null;
    let h=r.handle, acc=r.path;
    for(const seg of p.slice(r.path.length).split('/').filter(Boolean)){
      try{ h=await h.getDirectoryHandle(seg); }catch(e){ return null; }
      acc+='/'+seg; handles.set(acc,h);
    }
    return h;
  }

  document.documentElement.classList.add('web');
  window.api={
    platform:/Mac/.test(navigator.platform)?'darwin':'win32', sep:'/', web:true,
    dirname, basename, parse:p=>{const r=roots.find(x=>p===x.path||p.startsWith(x.path+'/'));return {root:r?r.path+'/':'/'};},
    fileUrl:p=>{ if(urls.has(p)) return urls.get(p); const f=files.get(p); if(!f) return ''; const u=URL.createObjectURL(/\.pdf$/i.test(p)&&f.type!=='application/pdf'?new Blob([f],{type:'application/pdf'}):f); urls.set(p,u); return u; },

    async list(dir,exts){
      const h=await resolve(dir,true); if(!h) return {error:'brak dostępu do folderu',dirs:[],files:[]};
      const ok=new Set(exts||[]), ds=[], fs=[];
      try{
        for await(const e of h.values()){
          if(e.name.startsWith('.')) continue;
          const p=join(dir,e.name);
          if(e.kind==='directory'){ handles.set(p,e); ds.push({name:e.name,path:p}); continue; }
          const i=e.name.lastIndexOf('.'); if(i<0||(ok.size&&!ok.has(e.name.slice(i+1).toLowerCase()))) continue;
          try{ const f=await e.getFile(); if(files.get(p)!==f&&urls.has(p)){URL.revokeObjectURL(urls.get(p));urls.delete(p);} files.set(p,f); fs.push({name:f.name,path:p,size:f.size,mtime:f.lastModified}); }catch(err){}
        }
      }catch(err){ return {error:err.message,dirs:ds,files:fs}; }
      return {dirs:ds,files:fs};
    },
    async exists(p){ return !!(await resolve(p,false)); },
    async roots(){ await loadRoots(); return roots.map(r=>({name:r.name,path:r.path,drive:false})); },
    async pickFolder(){
      if(!window.showDirectoryPicker){ say('Ta przeglądarka nie otwiera folderów — użyj Chrome albo Edge'); return null; }
      try{ const h=await showDirectoryPicker({id:'podglad',mode:'read'}); const p=await addRoot(h); if(typeof loadRoots==='function') setTimeout(()=>window.dispatchEvent(new Event('podglad-roots')),0); return p; }catch(e){ return null; }
    },
    async addDropped(item){ // folder upuszczony na okno
      try{ const h=await item.getAsFileSystemHandle(); if(h&&h.kind==='directory') return addRoot(h); }catch(e){} return null;
    },
    watch:async()=>{}, onDirChanged:()=>{}, onMenu:()=>{},

    async thumbGet(k){
      const key=k.path+'|'+k.size+'|'+k.mtime;
      const r=await tx('thumbs','readonly',s=>s.get(key)).catch(()=>null);
      if(!r) return null;
      return {url:URL.createObjectURL(r.blob),dims:r.dims,meta:r.meta,hash:key};
    },
    async thumbPut(k,buf,dims,meta){
      const key=k.path+'|'+k.size+'|'+k.mtime;
      await tx('thumbs','readwrite',s=>s.put({k:key,t:Date.now(),blob:new Blob([buf],{type:'image/webp'}),dims,meta,s:buf.byteLength})).catch(()=>{});
    },
    thumbForget:async h=>{ await tx('thumbs','readwrite',s=>s.delete(h)).catch(()=>{}); },
    async cacheInfo(){
      let count=0,bytes=0;
      await tx('thumbs','readonly',s=>{const r=s.openCursor();r.onsuccess=()=>{const c=r.result;if(c){count++;bytes+=c.value.s||0;c.continue();}};}).catch(()=>{});
      return {count,bytes,limitMB:+(localStorage.getItem('podglad-limit')||2048),dir:'pamięć przeglądarki'};
    },
    cacheClear:async()=>{ await tx('thumbs','readwrite',s=>s.clear()).catch(()=>{}); },
    cacheChoose:async()=>{ say('Wybór folderu na miniatury jest w programie'); return null; },
    cacheLimit:async mb=>{ localStorage.setItem('podglad-limit',String(mb)); },
    cacheReveal:onlyApp,

    showInFolder:onlyApp, openDefault:onlyApp,
    openEditor:async()=>{ onlyApp(); return null; },
    editorName:async()=>null,
    dragOut:()=>{},
    osThumb:async()=>null,
    fileHref:p=>window.api.fileUrl(p),
    pathForFile:()=>null
  };
})();

</script>
<script>
/* ===== Dekodery PSD i TGA (działają w wątku roboczym albo, awaryjnie, na stronie) ===== */
function decoderLib(){
  const MODES={0:'Bitmap',1:'Skala szarości',2:'Indeksowany',3:'RGB',4:'CMYK',7:'Wielokanałowy',8:'Duotone',9:'Lab'};
  const dv=u=>new DataView(u.buffer,u.byteOffset,u.byteLength);

  async function decode(file,type,max){
    if(type==='psd') return decodePSD(file,max);
    if(type==='psdthumb') return quickPSD(file);
    // bardzo duże pliki projektowe: podgląd jest na początku, czytamy najwyżej 64 MB
    const u=new Uint8Array(type==='embedded'&&file.size>96*1048576?await file.slice(0,64*1048576).arrayBuffer():await file.arrayBuffer());
    if(type==='tga') return decodeTGA(u,max);
    if(type==='tif') return decodeTIFF(u,max);
    if(type==='exr') return decodeEXR(u,max);
    if(type==='hdr') return decodeHDR(u,max);
    if(type==='raw') return decodeRAW(u,file.name||'');
    if(type==='embedded') return decodeEmbedded(u,file.name||'');
    throw new Error('Nieobsługiwany format');
  }

  // --- PSD / PSB: czyta tylko nagłówek i spłaszczony obraz z końca pliku, warstwy pomija
  async function decodePSD(file,max){
    const rd=async(a,b)=>new Uint8Array(await file.slice(a,b).arrayBuffer());
    const h=await rd(0,30), hv=dv(h);
    if(h.length<30||hv.getUint32(0)!==0x38425053) throw new Error('To nie jest plik PSD');
    const ver=hv.getUint16(4), ch=hv.getUint16(12), H=hv.getUint32(14), W=hv.getUint32(18),
          depth=hv.getUint16(22), mode=hv.getUint16(24), cmLen=hv.getUint32(26);
    let p=30, pal=null;
    if(mode===2&&cmLen>=768) pal=await rd(p,p+768);
    p+=cmLen;
    const resLen=dv(await rd(p,p+4)).getUint32(0), resStart=p+4;
    p=resStart+resLen;
    const L=ver===2?8:4, lb=dv(await rd(p,p+L*2+2));
    const layerLen=ver===2? lb.getUint32(0)*4294967296+lb.getUint32(4) : lb.getUint32(0);
    // ujemna liczba warstw = pierwszy kanał alfa to przezroczystość spłaszczonego obrazu
    const mergedAlpha=layerLen>L+2&&lb.byteLength>=L*2+2&&lb.getInt16(L*2)<0;
    p+=L+layerLen;
    const meta={format:ver===2?'PSB':'PSD',width:W,height:H,depth,mode:MODES[mode]||String(mode)};
    try{
      const img=composite(await rd(p,file.size),{ver,ch,W,H,depth,mode,pal,mergedAlpha},max);
      img.meta=meta; return img;
    }catch(e){
      const j=await psdThumb(rd,resStart,resLen);
      if(j) return {jpeg:j,meta,note:e.message+' — pokazano miniaturę zapisaną w pliku'};
      throw e;
    }
  }

  function composite(b,o,max){
    const {ver,ch,W,H,depth,mode,pal,mergedAlpha}=o;
    const base=mode===3?3:mode===4?4:(mode===1||mode===2||mode===8)?1:0;
    if(!base) throw new Error('tryb '+(MODES[mode]||mode)+' nieobsługiwany');
    const alpha=mergedAlpha&&ch>base, need=base+(alpha?1:0);
    if(depth!==8&&depth!==16) throw new Error(depth+'-bitowy obraz nieobsługiwany');
    if(ch<base||b.length<2) throw new Error('brak spłaszczonego obrazu');
    const bps=depth/8, rowBytes=W*bps;
    const step=max?Math.max(1,Math.floor(Math.max(W,H)/max)):1;
    const ow=Math.ceil(W/step), oh=Math.ceil(H/step);
    const comp=(b[0]<<8)|b[1], v=dv(b);
    const planes=[]; for(let c=0;c<need;c++) planes.push(new Uint8Array(ow*oh));
    const row=new Uint8Array(rowBytes);
    const sample=(src,off,dst,doff)=>{const s=step*bps;for(let x=0,i=off;x<ow;x++,i+=s)dst[doff+x]=src[i];};
    if(comp===1){
      const cs=ver===2?4:2; let dp=2+ch*H*cs;
      for(let c=0;c<need;c++) for(let y=0;y<H;y++){
        const k=2+(c*H+y)*cs, len=cs===2?v.getUint16(k):v.getUint32(k);
        if(y%step===0){ unpack(b,dp,len,row,rowBytes); sample(row,0,planes[c],(y/step)*ow); }
        dp+=len;
      }
    }else if(comp===0){
      for(let c=0;c<need;c++) for(let y=0;y<H;y+=step) sample(b,2+(c*H+y)*rowBytes,planes[c],(y/step)*ow);
    }else throw new Error('kompresja ZIP nieobsługiwana');
    const N=ow*oh, out=new Uint8ClampedArray(N*4);
    for(let i=0,j=0;i<N;i++,j+=4){
      if(mode===3){out[j]=planes[0][i];out[j+1]=planes[1][i];out[j+2]=planes[2][i];}
      else if(mode===4){const k=planes[3][i];out[j]=planes[0][i]*k/255;out[j+1]=planes[1][i]*k/255;out[j+2]=planes[2][i]*k/255;}
      else if(mode===2&&pal){const x=planes[0][i];out[j]=pal[x];out[j+1]=pal[256+x];out[j+2]=pal[512+x];}
      else out[j]=out[j+1]=out[j+2]=planes[0][i];
      if(alpha){ // Photoshop zapisuje kolor zmieszany z białym tłem — odwracamy to
        const a=planes[base][i]; out[j+3]=a;
        if(a<255){ if(a===0){out[j]=out[j+1]=out[j+2]=0;} else for(let k=0;k<3;k++) out[j+k]=(out[j+k]-(255-a))*255/a; }
      } else out[j+3]=255;
    }
    return {width:ow,height:oh,data:out};
  }

  function unpack(src,sp,len,dst,outLen){ // PackBits
    const end=sp+len; let o=0;
    while(sp<end&&o<outLen){
      let n=src[sp++];
      if(n<128){n++;const m=Math.min(n,outLen-o);dst.set(src.subarray(sp,sp+m),o);o+=m;sp+=n;}
      else if(n>128){n=257-n;const m=Math.min(n,outLen-o);dst.fill(src[sp],o,o+m);o+=m;sp++;}
    }
    if(o<outLen) dst.fill(0,o);
  }

  async function quickPSD(file){
    const rd=async(a,b)=>new Uint8Array(await file.slice(a,b).arrayBuffer());
    const h=await rd(0,30), hv=dv(h);
    if(h.length<30||hv.getUint32(0)!==0x38425053) throw new Error('To nie jest plik PSD');
    const ver=hv.getUint16(4), W=hv.getUint32(18), H=hv.getUint32(14), depth=hv.getUint16(22), mode=hv.getUint16(24);
    const p=30+hv.getUint32(26), resLen=dv(await rd(p,p+4)).getUint32(0);
    const j=await psdThumb(rd,p+4,resLen); if(!j) throw new Error('brak miniatury w pliku');
    return {jpeg:j,meta:{format:ver===2?'PSB':'PSD',width:W,height:H,depth,mode:MODES[mode]||String(mode)}};
  }
  async function psdThumb(rd,start,len){ // zasób 1036: miniatura JPEG
    const r=await rd(start,start+len), v=dv(r); let p=0;
    while(p+12<=r.length){
      if(v.getUint32(p)!==0x3842494D) break;
      const id=v.getUint16(p+4); p+=6;
      p+=(r[p]+2)&~1;
      const size=v.getUint32(p); p+=4;
      if(id===1036&&v.getUint32(p)===1) return r.slice(p+28,p+size);
      p+=(size+1)&~1;
    }
    return null;
  }

  // --- TGA: typy 1,2,3 i ich wersje RLE 9,10,11
  function decodeTGA(u,max){
    const v=dv(u);
    if(u.length<18) throw new Error('Uszkodzony plik TGA');
    const idLen=u[0],cmType=u[1],type=u[2],cmFirst=v.getUint16(3,true),cmLen=v.getUint16(5,true),cmDepth=u[7];
    const W=v.getUint16(12,true),H=v.getUint16(14,true),bpp=u[16],desc=u[17];
    if(![1,2,3,9,10,11].includes(type)) throw new Error('Nieobsługiwany typ TGA ('+type+')');
    let p=18+idLen, pal=null;
    if(cmType===1){const eb=Math.ceil(cmDepth/8);pal=new Uint8ClampedArray(cmLen*4);for(let i=0;i<cmLen;i++)pix(u,p+i*eb,cmDepth,pal,i*4);p+=cmLen*eb;}
    const base=type&7, bytes=Math.ceil(bpp/8), n=W*H, px=new Uint8ClampedArray(n*4);
    const put=(sp,i)=>{const o=i*4;
      if(base===1){let x=(bytes===1?u[sp]:u[sp]|u[sp+1]<<8)-cmFirst;x*=4;px[o]=pal[x];px[o+1]=pal[x+1];px[o+2]=pal[x+2];px[o+3]=pal[x+3];}
      else if(base===3){px[o]=px[o+1]=px[o+2]=u[sp];px[o+3]=bytes===2?u[sp+1]:255;}
      else pix(u,sp,bpp,px,o);

        const w=v.getUint32(p+16),h=v.getUint32(p+20);
        let e=-1; for(let q=p+8;q+8<=u.length;){ const len=v.getUint32(q); if(q+12+len>u.length) break; if(u[q+4]===0x49&&u[q+5]===0x45&&u[q+6]===0x4E&&u[q+7]===0x44){e=q+12;break;} q+=12+len; }
        if(e>0&&w<20000&&h<20000){ take({img:u.slice(p,e),mime:'image/png',w,h}); p=e-1; }
      } else if(b===0xFF&&u[p+1]===0xD8&&u[p+2]===0xFF){
        const j=jpegAt(u,p); if(j){ take({img:u.slice(j.s,j.e),mime:'image/jpeg',w:j.w,h:j.h}); p=j.e-1; }
      } else if(dib&&b===40&&u[p+1]===0&&u[p+2]===0&&u[p+3]===0&&p+40<=u.length){
        const w=v.getInt32(p+4,true), h=Math.abs(v.getInt32(p+8,true)), pl=v.getUint16(p+12,true), bpp=v.getUint16(p+14,true), cmp=v.getUint32(p+16,true);
        if(pl===1&&(bpp===24||bpp===32||bpp===8)&&cmp===0&&w>=16&&w<=2048&&h>=16&&h<=2048){
          let pal=v.getUint32(p+32,true); if(!pal&&bpp===8) pal=256; if(pal>256) continue;
          const size=40+pal*4+(((w*bpp+31)>>5)<<2)*h;
          if(p+size<=u.length){ take({img:dibToBmp(u.subarray(p,p+size)),mime:'image/bmp',w,h}); p+=size-1; }
        }
      }
    }
    if(!best) throw new Error('brak podglądu zapisanego w pliku — otwórz go w programie');
    return {img:best.img,mime:best.mime,meta:{format:ext.toUpperCase(),mode:'podgląd zapisany w pliku'}};
  }
  return {decode};
}

<script>
/* ===== Podgląd — interfejs ===== */
const $=s=>document.querySelector(s);
const EXT={jpg:'jpg',jpeg:'jpg',jpe:'jpg',jfif:'jpg',png:'png',psd:'psd',psb:'psd',tif:'tif',tiff:'tif',tga:'tga',exr:'exr',hdr:'hdr',

  dng:'raw',cr2:'raw',cr3:'raw',nef:'raw',nrw:'raw',arw:'raw',sr2:'raw',srf:'raw',orf:'raw',rw2:'raw',raf:'raw',pef:'raw',srw:'raw',
  '3fr':'raw',iiq:'raw',erf:'raw',kdc:'raw',mrw:'raw',rwl:'raw',x3f:'raw',
  pdf:'pdf',dwg:'dwg',skp:'skp',max:'max','3dm':'3dm',pln:'pln',pla:'pln',tpl:'pln',
  mp4:'vid',m4v:'vid',mov:'vid',webm:'vid',mkv:'vid',avi:'vid',wmv:'vid',mpg:'vid',mpeg:'vid',ogv:'vid','3gp':'vid',mts:'vid',m2ts:'vid'};
const EXTS=Object.keys(EXT);
const TYPES=['jpg','png','psd','tif','tga','exr','hdr','raw','webp','avif','gif','bmp','ico','svg','pdf','dwg','skp','max','3dm','pln','vid'];
const DOCS=new Set(['pdf','dwg','skp','max','3dm','pln']);   // pliki projektowe: miniatura systemowa albo zapisana w pliku // kolejność filtrów
const NATIVE=new Set(['jpg','png','webp','avif','gif','bmp','ico','svg']);           // dekoduje silnik przeglądarki
const OPAQUE=new Set(['jpg','raw','hdr','exr']);                                     // nie mają przezroczystości
const on=t=>S.types[t]!==false;
const extOf=n=>{const i=n.lastIndexOf('.');return i<0?'':n.slice(i+1).toLowerCase();};
const coll=new Intl.Collator('pl',{numeric:true,sensitivity:'base'});
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l');
const plural=(n,a,b,c)=>n===1?a:(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?b:c;
const isMac=api.platform==='darwin', SEP=api.sep;
const FINDER=isMac?'Finderze':'Eksploratorze';
const TH=480;       // rozdzielczość miniatur w pikselach
const SKIM=12;      // ile obrazów folderu można przejrzeć na kafelku
const grid=$('#grid'), main=$('#main');

/* --- ustawienia (zapisywane lokalnie w programie) --- */
const S=Object.assign({types:{},sort:'name',dir:1,size:180,lic:28,mode:'icons',names:true,theme:null,favs:[],last:null},
  (()=>{try{return JSON.parse(localStorage.getItem('podglad')||'{}');}catch(e){return {};}})());

const press=(b,v)=>b.setAttribute('aria-pressed',v?'true':'false');

function applyTheme(){

}
// przyciski okna (Windows) w kolorze tła; na Macu „światła” po lewej
if(!api.web) document.documentElement.classList.add(api.platform==='darwin'?'frame-mac':'frame-win');
function chromeSync(){
  if(api.web||!api.chromeColors) return;

  const bg=(v&&v.classList.contains('open')?cs.getPropertyValue('--stage'):cs.getPropertyValue('--bg')).trim();

}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);

function cycleTheme(){S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();applyTheme();}

/* rozmiar miniatur: suwak, + i −, Ctrl/⌘ + kółko lub gest szczypania na gładziku */
function setSize(v,tip){
  if(S.mode==='list'){S.lic=Math.round(Math.max(16,Math.min(96,v)));document.documentElement.style.setProperty('--lic',S.lic+'px');if(tip)zoomTip(S.lic+' px');}
  else{S.size=Math.round(Math.max(90,Math.min(420,v)));$('#size').value=S.size;document.documentElement.style.setProperty('--tile-w',S.size+'px');sliderFill();
    if(tip){const n=cols();zoomTip(n+' '+plural(n,'kolumna','kolumny','kolumn'));}}
  save();
}
const zcur=()=>S.mode==='list'?S.lic:S.size;
const zstep=d=>setSize(zcur()*(d>0?1.15:1/1.15),true);
let tipEl=null,tipT=0;
function zoomTip(t){if(!tipEl){tipEl=document.createElement('div');tipEl.className='zoomtip';document.body.appendChild(tipEl);}
  tipEl.textContent=t;tipEl.classList.add('on');clearTimeout(tipT);tipT=setTimeout(()=>tipEl.classList.remove('on'),800);}
document.documentElement.style.setProperty('--lic',S.lic+'px');
setSize(S.size);
$('#size').oninput=e=>{S.mode==='list'?setSize(+e.target.value/6):setSize(+e.target.value);};
function sliderFill(){const s=$('#size');s.style.setProperty('--p',((s.value-s.min)/(s.max-s.min)*100)+'%');}
$('#size').addEventListener('input',sliderFill);
main.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();setSize(zcur()*Math.exp(-e.deltaY/100),true);},{passive:false});

/* filtry, sortowanie, widoki */
function typeCounts(){const n={}; for(const it of items) n[it.type]=(n[it.type]||0)+1; return n;}
const TLABEL=t=>t==='tif'?'TIFF':t==='pln'?'Archicad':t==='vid'?'Wideo':t.toUpperCase();
const fmtDur=s=>{if(!isFinite(s))return '';s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');};
const ICO_DOWN='<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m2.5 4 2.5 2.5L7.5 4"/></svg>';
function renderTypes(){
  const n=typeCounts(), present=TYPES.filter(t=>n[t]), shown=present.filter(t=>on(t));
  const b=$('#typesBtn'); let l='Wszystkie typy';
  if(shown.length<present.length) l=shown.length?shown.slice(0,2).map(TLABEL).join(', ')+(shown.length>2?' +'+(shown.length-2):''):'Żaden typ';
  b.innerHTML='<span></span>'+ICO_DOWN; b.firstChild.textContent=l; b.classList.toggle('on',shown.length<present.length);
}
function refilter(){save();renderTypes();for(const d of dirs)resetDir(d);applyView(keep());}
function typesMenu(){
  const n=typeCounts(), r=$('#typesBtn').getBoundingClientRect();
  const present=TYPES.filter(t=>n[t]||!on(t));
  $('#typesBtn').classList.add('open');
  if(!present.length){showMenu(r.left,r.bottom+6,'Brak obrazów w tym folderze',[]);return;}
  showMenu(r.left,r.bottom+6,null,[
    ...present.map(t=>({label:TLABEL(t),box:on(t),n:n[t]||0,keep:true,run:()=>{S.types[t]=!on(t);refilter();typesMenu();}})),
    '-',{label:'Pokaż wszystkie',dim:true,run:()=>{S.types={};refilter();}}]);
}
$('#typesBtn').onclick=e=>{e.stopPropagation();ctx.hidden||ctx.dataset.of!=='types'?(typesMenu(),ctx.dataset.of='types'):hideMenu();};
const DEF_DIR={name:1,type:1,date:-1,size:-1,dims:-1};
const SORTS=[['name','Nazwa','A → Z','Z → A'],['date','Data zmiany','Od najstarszych','Od najnowszych'],['size','Rozmiar pliku','Od najmniejszych','Od największych'],['dims','Wymiary','Od najmniejszych','Od największych'],['type','Rodzaj','A → Z','Z → A']];
function setSort(k){ if(S.sort===k) S.dir=-S.dir; else {S.sort=k;S.dir=DEF_DIR[k]||1;} save(); markSort(); applyView(keep()); }
function markSort(){
  const s=SORTS.find(x=>x[0]===S.sort)||SORTS[0], b=$('#sortBtn');
  b.innerHTML='<span></span><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="'+(S.dir>0?'M5 8V2M2.5 4.5 5 2l2.5 2.5':'M5 2v6M2.5 5.5 5 8l2.5-2.5')+'"/></svg>';
  b.firstChild.textContent=s[1]; b.title='Sortowanie: '+s[1]+', '+(S.dir>0?s[2]:s[3]).replace(/^Od /,'od ');
}
function sortMenu(){
  const r=$('#sortBtn').getBoundingClientRect(), s=SORTS.find(x=>x[0]===S.sort)||SORTS[0];
  $('#sortBtn').classList.add('open');
  showMenu(r.left,r.bottom+6,'Sortuj według',[
    ...SORTS.map(x=>({label:x[1],check:x[0]===S.sort,run:()=>{if(S.sort!==x[0])setSort(x[0]);}})),
    '-',
    {label:s[2],check:S.dir>0,run:()=>{S.dir=1;save();markSort();applyView(keep());}},
    {label:s[3],check:S.dir<0,run:()=>{S.dir=-1;save();markSort();applyView(keep());}}]);
}
$('#sortBtn').onclick=e=>{e.stopPropagation();ctx.hidden||ctx.dataset.of!=='sort'?(sortMenu(),ctx.dataset.of='sort'):hideMenu();};
function markModes(){
  document.querySelectorAll('#mode button').forEach(b=>press(b,b.dataset.v===S.mode));
  $('#size').min=S.mode==='list'?96:90; $('#size').max=S.mode==='list'?576:420;
  $('#size').value=S.mode==='list'?S.lic*6:S.size; sliderFill();
}
function setMode(m){if(S.mode===m)return;S.mode=m;save();markModes();render();}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>setMode(b.dataset.v));
function setNames(v){S.names=v;save();document.body.classList.toggle('nonames',!v);}
function setSide(v){S.side=v;save();document.body.classList.toggle('noside',!v);press($('#sideBtn'),v);}
$('#sideBtn').onclick=()=>setSide(S.side===false);
function setInsp(v){S.insp=v;save();document.body.classList.toggle('insp',v);press($('#inspBtn'),v);if(v)renderInsp();requestAnimationFrame(()=>{if(S.mode!=='list'&&curPath)setSize(S.size);});}
$('#inspBtn').onclick=()=>setInsp(!S.insp);
// zwijane sekcje paska bocznego
S.shut=S.shut||{};
document.querySelectorAll('.sec').forEach(b=>{const k=b.dataset.sec;
  const apply=()=>{b.classList.toggle('shut',!!S.shut[k]);$('#'+k).classList.toggle('shut',!!S.shut[k]);};
  b.onclick=()=>{S.shut[k]=!S.shut[k];save();apply();}; apply();});

/* wyszukiwanie */
let qt=0;
$('#q').oninput=()=>{$('#qClear').hidden=!$('#q').value;clearTimeout(qt);qt=setTimeout(()=>applyView(keep()),120);};
$('#qClear').onclick=()=>{$('#q').value='';$('#qClear').hidden=true;applyView(keep());$('#q').focus();};
function markScope(){const b=$('#qScope');press(b,!!S.qAll);b.textContent=S.qAll?'wszędzie':'tu';b.title=S.qAll?'Szukam też w podfolderach — kliknij, żeby szukać tylko tutaj':'Szukam tylko w tym folderze — kliknij, żeby szukać też w podfolderach';}
$('#qScope').onclick=()=>{S.qAll=!S.qAll;save();markScope();if($('#q').value)applyView(keep());$('#q').focus();};
markScope();
$('#deepChip').onclick=()=>setDeep(false);

/* --- pamięć miniatur (folder na dysku, obsługuje ją proces główny) --- */
const fmtSize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':b<1073741824?(b/1048576).toLocaleString('pl',{maximumFractionDigits:1})+' MB':(b/1073741824).toLocaleString('pl',{maximumFractionDigits:1})+' GB';
let cacheC=null;
async function cacheInfo(){
  const c=cacheC=await api.cacheInfo();
  $('#cache').textContent=c.count.toLocaleString('pl')+' miniatur · '+fmtSize(c.bytes)+(api.web?'':' z '+fmtSize(c.limitMB*1048576));
  $('#cache').title='Pamięć miniatur: '+c.dir;
}
let newThumbs=0; setInterval(()=>{if(newThumbs){newThumbs=0;cacheInfo();}},4000);
async function cacheClear(){
  if(!confirm('Usunąć zapamiętane miniatury? Policzą się od nowa przy następnym otwarciu folderów.')) return;
  await api.cacheClear();
  for(const it of items){it.thumb=null;it.state=null;it._tp=null;}
  for(const d of dirs) resetDir(d);
  render(); prefetch(); cacheInfo();
}
function settingsMenu(){
  const r=$('#setBtn').getBoundingClientRect(), t=S.theme||'auto', lim=cacheC?cacheC.limitMB:2048;
  const LIM=[[1024,'1 GB'],[2048,'2 GB'],[5120,'5 GB'],[10240,'10 GB']];
  showMenu(r.left-4,r.top-8,'Motyw',[
    {label:'Automatyczny',check:t==='auto',run:()=>setTheme('auto')},
    {label:'Jasny',check:t==='light',run:()=>setTheme('light')},
    {label:'Ciemny',check:t==='dark',keys:['T'],run:()=>setTheme('dark')},
    '-',
    {label:'Nazwy pod miniaturami',box:S.names!==false,keys:['N'],keep:true,run:()=>{setNames(!(S.names!==false));settingsMenu();}},
    {label:'Ukryj interfejs',keys:['Tab'],run:toggleBare},
    '-',{head:'Pamięć miniatur'+(api.web?' w przeglądarce':'')},
    ...(api.web?[]:LIM.map(([mb,l])=>({label:'Limit '+l,check:lim===mb,run:async()=>{await api.cacheLimit(mb);cacheInfo();}}))),
    ...(api.web?[]:[{label:'Przenieś do innego folderu…',run:async()=>{const d=await api.cacheChoose();if(d){zoomTip('Miniatury w: '+d);cacheInfo();}}},
      {label:'Pokaż folder z miniaturami',run:()=>api.cacheReveal()}]),
    {label:'Wyczyść miniatury',run:cacheClear}],true);
}
$('#setBtn').onclick=e=>{e.stopPropagation();ctx.hidden||ctx.dataset.of!=='set'?(settingsMenu(),ctx.dataset.of='set'):hideMenu();};

/* --- pliki: odczyt przez protokół pgf:// (z zakresami, więc PSD czytamy kawałkami) --- */
const ref=f=>({name:f.name,size:f.size,url:api.fileUrl(f.path)});
function asFile(r){
  const rd=x=>{if(!x.ok)throw new Error('nie można odczytać pliku');return x.arrayBuffer();};
  const get=(a,b)=>{b=Math.min(b,r.size); if(a>=b) return Promise.resolve(new ArrayBuffer(0));
    return fetch(r.url,{headers:{Range:'bytes='+a+'-'+(b-1)}}).then(rd);};
  return {name:r.name,size:r.size,slice:(a,b)=>({arrayBuffer:()=>get(a,b===undefined?r.size:b)}),arrayBuffer:()=>fetch(r.url).then(rd)};
}
const blobOf=it=>fetch(api.fileUrl(it.path)).then(x=>{if(!x.ok)throw new Error('nie można odczytać pliku');return x.blob();});

/* --- ulubione --- */
const samePath=(a,b)=>a&&b&&(isMac?a===b:a.toLowerCase()===b.toLowerCase());
const findFav=p=>S.favs.find(f=>samePath(f.path,p));
function toggleFav(p){
  p=p||curPath; if(!p) return;
  const f=findFav(p);
  if(f) S.favs=S.favs.filter(x=>x!==f); else S.favs.push({name:api.basename(p)||p,path:p});
  save(); renderSide();
}
async function openFav(f){
  if(!(await api.exists(f.path))){status('Folderu „'+f.name+'” nie ma pod zapisaną ścieżką — mógł zostać przeniesiony.');return;}
  go(f.path);
}

/* --- foldery i pliki --- */
let curPath=null, dirs=[], items=[], view=[], sel=-1, anchor=-1, picked=new Set(), scanTok=0, gen=0;
// „wszystko w środku”: obrazy z podfolderów w jednej siatce, pogrupowane nagłówkami folderów
let deep=false, deepItems=null, deepFor=null, deepTok=0, heads=null;
const keep=()=>{const it=view[sel];return it?it.path:null;};

async function pickFolder(){ const p=await api.pickFolder(); if(p){ if(api.web) await loadRoots(); go(p); } }
function go(p,selectPath,inside){ curPath=p; S.last=p; save(); deep=!!inside; deepItems=null; deepFor=null; $('#q').value='';$('#qClear').hidden=true; markDeep(); scan(false,selectPath); }
function setDeep(v){ deep=v; markDeep(); applyView(keep()); main.scrollTop=0; prefetch(); }
function markDeep(){ const c=$('#deepChip'); c.hidden=!deep; }
async function scan(keepScroll,selectPath){
  if(!curPath) return;
  const tok=++scanTok, prevPath=selectPath||keep(), prevTop=main.scrollTop, here=curPath;
  if(keepScroll){ deepItems=null; deepFor=null; }
  status('Wczytywanie…');
  const r=await api.list(here,EXTS);
  if(tok!==scanTok) return;
  if(r.error){status('Błąd: '+r.error);}
  // zachowaj już policzone miniatury tych samych plików
  const old=new Map(items.map(it=>[it.path+'|'+it.size+'|'+it.mtime,it]));
  const oldDirs=new Map(dirs.map(d=>[d.path,d]));
  gen++;
  items=r.files.map(f=>{
    const o=old.get(f.path+'|'+f.size+'|'+f.mtime);
    if(o&&o.state==='done'){o.gen=gen;o.tile=null;return o;}
    return {kind:'file',name:f.name,path:f.path,size:f.size,mtime:f.mtime,type:EXT[extOf(f.name)],gen,state:null};
  });
  dirs=r.dirs.map(d=>oldDirs.get(d.path)&&keepScroll?Object.assign(oldDirs.get(d.path),{tile:null}):{kind:'dir',name:d.name,path:d.path,files:null,count:null,state:null})
    .sort((a,b)=>coll.compare(a.name,b.name));
  renderTypes();
  applyView(prevPath);
  renderSide(); renderCrumbs(); syncTree();
  main.scrollTop=keepScroll?prevTop:0;
  if(sel>=0&&view[sel].tile&&!keepScroll) view[sel].tile.scrollIntoView({block:'center'});
  api.watch(here);
  prefetch();
}
api.onDirChanged(d=>{ if(samePath(d,curPath)&&!viewer.classList.contains('open')) scan(true); });
function goUp(){
  if(!curPath) return;
  if(deep&&!$('#q').value){ setDeep(false); return; }
  const p=api.dirname(curPath); if(!p||p===curPath) return;
  const from=curPath; curPath=p; S.last=p; save(); deep=false; deepItems=null; deepFor=null; markDeep(); scan(false,from);
}
// wczytanie całego drzewa pod bieżącym folderem
async function loadDeep(){
  if(deepFor===curPath&&deepItems) return true;
  const here=curPath, tok=++deepTok, out=[], known=new Map(items.map(it=>[it.path,it]));
  const base=here.replace(/[\\/]+$/,'');
  const relOf=p=>{const d=api.dirname(p); return d.length>base.length?d.slice(base.length+1):'';};
  let queue=[here], n=0;
  while(queue.length){
    const batch=queue.splice(0,6);
    const res=await Promise.all(batch.map(d=>api.list(d,EXTS)));
    if(tok!==deepTok||here!==curPath) return false;
    for(const r of res){
      for(const f of r.files){
        const o=known.get(f.path);
        const it=o&&o.size===f.size&&o.mtime===f.mtime?o:{kind:'file',name:f.name,path:f.path,size:f.size,mtime:f.mtime,type:EXT[extOf(f.name)],gen,state:null};
        it.rel=relOf(f.path); out.push(it);
      }
      for(const d of r.dirs) queue.push(d.path);
    }
    n=out.length; status('Wczytywanie podfolderów… '+n+' '+plural(n,'obraz','obrazy','obrazów'));
    if(out.length>40000) break;
  }
  deepItems=out; deepFor=here; return true;
}

function crumbsOf(p){
  const out=[], pr=api.parse(p);
  let acc=pr.root; out.push({name:(api.web?pr.root.replace(/^\/|\/$/g,''):pr.root.replace(/[\\/]+$/,''))||(isMac?'Dysk':'/'),path:api.web?pr.root.replace(/\/$/,''):pr.root});
  for(const seg of p.slice(pr.root.length).split(/[\\/]+/).filter(Boolean)){ acc=acc.endsWith(SEP)?acc+seg:acc+SEP+seg; out.push({name:seg,path:acc}); }
  return out;
}
function renderCrumbs(){
  const c=$('#crumbs'); c.textContent='';
  if(!curPath){$('#fav').disabled=true;return;}
  const cs=crumbsOf(curPath);
  cs.forEach((x,i)=>{
    if(i){const s=document.createElement('i');s.textContent='/';c.appendChild(s);}
    const el=document.createElement(i===cs.length-1?'span':'a');
    el.textContent=x.name; el.title=x.path; if(i<cs.length-1) el.onclick=()=>go(x.path);
    c.appendChild(el);
  });
  $('#fav').disabled=false;

/* --- drzewo folderów: miejsca w systemie i dyski, jak zakładka Folders w Bridge --- */
let roots=[], treeCur=null;
async function loadRoots(){ roots=(await api.roots()).map(r=>({path:r.path,name:r.name,drive:r.drive,kids:null,open:false,up:null})); renderTree(); }
async function kidsOf(n){
  if(n.kids) return n.kids;
  const r=await api.list(n.path,['__brak__']);
  n.kids=r.dirs.sort((a,b)=>coll.compare(a.name,b.name)).map(d=>({path:d.path,name:d.name,kids:null,open:false,up:n}));
  return n.kids;
}
const under=(p,root)=>samePath(p,root)||(isMac?p:p.toLowerCase()).startsWith((isMac?root:root.toLowerCase()).replace(/[\\/]?$/,SEP));
async function syncTree(){
  treeCur=null;
  if(curPath){
    let best=null; for(const r of roots) if(under(curPath,r.path)&&(!best||r.path.length>best.path.length)) best=r;
    if(best){
      let n=best; n.open=true;
      const rest=curPath.slice(best.path.replace(/[\\/]$/,'').length).split(/[\\/]+/).filter(Boolean);
      for(const seg of rest){const ks=await kidsOf(n);const m=ks.find(k=>samePath(k.name,seg));if(!m){n=null;break;}m.open=true;n=m;}
      treeCur=n; if(n) await kidsOf(n);
    }
  }
  renderTree();
  const el=$('#tree li.on'); if(el) el.scrollIntoView({block:'nearest'});
}
const TW='<svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M3 1.5 5.5 4 3 6.5"/></svg>';

/* --- widok --- */
function applyView(keepPath){
  const q=norm($('#q').value.trim());
  const isDeep=deep||(S.qAll&&!!q);
  if(isDeep&&!(deepFor===curPath&&deepItems)){
    loadDeep().then(ok=>{ if(ok){ applyView(keepPath); prefetch(); } });
    if(!view.length) status('Wczytywanie podfolderów…');
    return;
  }
  heads=null;
  const ds=isDeep?[]:dirs.filter(d=>!q||norm(d.name).includes(q));
  const fs=(isDeep?deepItems:items).filter(it=>on(it.type)&&(!q||norm(isDeep?(it.rel+'/'+it.name):it.name).includes(q)));
  const d=S.dir, byName=(a,b)=>coll.compare(a.name,b.name);
  const by={
    name:(a,b)=>byName(a,b)*d,
    date:(a,b)=>(a.mtime-b.mtime)*d||byName(a,b),
    size:(a,b)=>(a.size-b.size)*d||byName(a,b),
    type:(a,b)=>a.type.localeCompare(b.type)*d||byName(a,b),
    dims:(a,b)=>((a.dims?a.dims[0]*a.dims[1]:0)-(b.dims?b.dims[0]*b.dims[1]:0))*d||byName(a,b)
  }[S.sort];
  fs.sort(by);
  if(S.sort==='name'&&d<0) ds.reverse();
  if(isDeep){ // grupy według podfolderów, najpierw sam folder
    const g=new Map(); for(const it of fs){ if(!g.has(it.rel)) g.set(it.rel,[]); g.get(it.rel).push(it); }
    const keys=[...g.keys()].sort((a,b)=>a===''?-1:b===''?1:coll.compare(a,b));
    view=[]; heads=new Map();
    for(const k of keys){ heads.set(view.length,{rel:k,count:g.get(k).length}); view.push(...g.get(k)); }
  } else view=[...ds,...fs];
  sel=keepPath?view.findIndex(it=>samePath(it.path,keepPath)):-1; anchor=sel;
  picked=new Set(sel>=0?[view[sel]]:[]);
  render();
}

/* --- foldery w siatce: okładka i przeglądanie zawartości ruchem myszy --- */
function resetDir(d){d.files=null;d.count=null;d.state=null;d._p=null;d.si=0;}
function loadDir(d,hi){
  if(d._p){ if(hi&&d.files&&d.files[0]) enqueue(d.files[0],true); return d._p; }
  d.state='loading';
  return d._p=(async()=>{
    const mk=f=>({kind:'file',name:f.name,path:f.path,size:f.size,mtime:f.mtime,type:EXT[extOf(f.name)],state:null,gen});
    const r=await api.list(d.path,EXTS);
    let all=r.files.map(mk).filter(f=>on(f.type));
    all.sort((a,b)=>coll.compare(a.name,b.name));
    d.count=all.length; d.sub=r.dirs.length;
    // folder tylko z podfolderami: okładka i przewijanie z obrazów w podfolderach
    if(!all.length&&r.dirs.length){
      const queue=r.dirs.map(x=>x.path).sort(coll.compare); let seen=0;
      while(queue.length&&all.length<SKIM*6&&seen<40){
        const batch=queue.splice(0,4); seen+=batch.length;
        const res=await Promise.all(batch.map(x=>api.list(x,EXTS)));
        for(const s of res){
          const fs=s.files.map(mk).filter(f=>on(f.type)).sort((a,b)=>coll.compare(a.name,b.name));
          all.push(...fs.slice(0,SKIM));            // po kilka z każdego podfolderu, żeby było widać różnorodność
          queue.push(...s.dirs.map(x=>x.path).sort(coll.compare));
        }
      }
      d.deep=true;
    }
    d.files=all.length<=SKIM?all:Array.from({length:SKIM},(_,k)=>all[Math.floor(k*all.length/SKIM)]);
    d.si=0; d.state='done';
    coverFrom(d,0,hi||d.visible);
    paint(d);
  })();
}
const FOLDER_ICO='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width=".9" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h2.2l1 1.2h3.8a1 1 0 0 1 1 1v4.3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1z"/></svg>';
const FOLDER_ICO_S='<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h2.2l1 1.2h3.8a1 1 0 0 1 1 1v4.3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1z"/></svg>';
function coverFrom(d,i,hi){ // okładka: pierwszy plik, który da się pokazać (najwyżej 6 prób)
  const f=d.files&&d.files[i]; if(!f||i>5){ paint(d); return; }
  f.cb=()=>{ if(f.thumb){ if(i){ d.files.splice(i,1); d.files.unshift(f); } paint(d); } else coverFrom(d,i+1,hi); };
  enqueue(f,hi);
}
function paintDir(d){
  if(!d.tile||d.tile.tagName==='TR'){ if(d.tile) paint(d); return; }
  const box=d.tile.firstChild; box.textContent='';
  const f=d.files&&d.files[d.si||0];
  if(f&&f.thumb) box.appendChild(f.thumb);
  else if(d.state==='done'&&!(d.files&&d.files.length)){const s=document.createElement('span');s.className='ph';s.innerHTML=FOLDER_ICO;box.appendChild(s);}
  if(d.count||(d.deep&&d.sub)){const c=document.createElement('span');c.className='chip';c.innerHTML=FOLDER_ICO_S;
    c.appendChild(document.createTextNode(d.count?d.count:d.sub+' '+plural(d.sub,'folder','foldery','folderów')));box.appendChild(c);}
  if(d.files&&d.files.length>1){
    const sk=document.createElement('div');sk.className='sk';
    for(let k=0;k<d.files.length;k++){const i=document.createElement('i');if(k===(d.si||0))i.className='on';sk.appendChild(i);}
    const cn=document.createElement('span');cn.className='cnt';cn.textContent=((d.si||0)+1)+'/'+d.files.length;
    box.append(sk,cn);
  }
}
grid.addEventListener('pointermove',e=>{

/* --- kolejka miniatur: najpierw widoczne, potem w tle cały folder i okładki podfolderów --- */
const hiQ=[], loQ=[]; let running=0;
const MAXRUN=Math.min(6,Math.max(2,(navigator.hardwareConcurrency||4)-1));
function enqueue(it,hi,front){
  if(it.state==='done'||it.state==='loading'||it.state==='error'){ if(it.state==='done'&&it.cb){const c=it.cb;it.cb=null;c();} return; }
  if(it.state==='queued'){ if(hi&&!it.hi){it.hi=true;front?hiQ.unshift(it):hiQ.push(it);pump();} return; }
  it.state='queued'; it.hi=!!hi; (hi?(front?a=>hiQ.unshift(a):a=>hiQ.push(a)):a=>loQ.push(a))(it); pump();
}
function take(){
  while(hiQ.length){const x=hiQ.shift(); if(x.state==='queued'&&x.gen===gen) return x;}
  while(loQ.length){const x=loQ.shift(); if(x.state==='queued'&&x.gen===gen) return x;}
  return null;
}
function pump(){
  while(running<MAXRUN){
    const it=take(); if(!it) break;
    running++; it.state='loading';
    thumbOf(it).then(()=>{it.state='done';},e=>{it.state='error';it.err=e&&e.message||String(e);})
      .finally(()=>{running--;
        if(it.tile&&it.tile.isConnected) paint(it);
        if(it.cb){const c=it.cb;it.cb=null;c();}
        if(view[sel]===it) status();
        progress(); pump();});
  }
  progress();
}
async function prefetch(){
  const g=gen;
  for(const it of view) if(it.kind==='file') enqueue(it,false);
  for(const d of dirs){ if(g!==gen) return; await loadDir(d,false); }
}
let progT=0;
function progress(){
  if(progT) return;
  progT=requestAnimationFrame(()=>{progT=0;
    const total=items.length, done=items.filter(x=>x.state==='done'||x.state==='error').length;
    $('#prog').textContent=total&&done<total?'Miniatury: '+done+' / '+total:'';
  });
}
function thumbOf(it){ return it._tp||(it._tp=buildThumb(it)); }
async function buildThumb(it){
  const key={path:it.path,size:it.size,mtime:it.mtime};
  const hit=await api.thumbGet(key);
  if(hit){
    try{
      const b=await fetch(hit.url).then(x=>{if(!x.ok)throw 0;return x.blob();}).finally(()=>{if(hit.url.startsWith('blob:'))URL.revokeObjectURL(hit.url);});
      const bmp=await createImageBitmap(b);
      const c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;c.getContext('2d').drawImage(bmp,0,0);bmp.close();
      it.thumb=c; it.dims=hit.dims||it.dims; it.meta=hit.meta||it.meta; return;
    }catch(e){ api.thumbForget(hit.hash); }
  }
  let bmp;
  if(it.type==='vid'){ // klatka z ~10% długości filmu; gdy przeglądarka nie zna kodeka — miniatura systemowa
    let f=null; try{f=await videoFrame(api.fileUrl(it.path));}catch(e){}
    const fmt=extOf(it.name).toUpperCase();
    if(f){bmp=f.bmp;it.dims=[f.w,f.h];it.meta={format:fmt,mode:fmtDur(f.dur)};}
    else{const png=await api.osThumb(it.path,TH); if(!png) throw new Error('nie można odtworzyć tego formatu — otwórz w programie');
      bmp=await createImageBitmap(new Blob([png],{type:'image/png'})); it.meta={format:fmt,mode:'',noplay:true};}
    const s=Math.min(1,TH/Math.max(bmp.width,bmp.height)), c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(bmp.width*s)); c.height=Math.max(1,Math.round(bmp.height*s));
    const g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(bmp,0,0,c.width,c.height); bmp.close();
    it.thumb=c;
    c.toBlob(b=>{ if(b) b.arrayBuffer().then(buf=>api.thumbPut(key,buf,it.dims||null,it.meta)).then(()=>newThumbs++); },'image/webp',0.82);
    return;
  }
  if(DOCS.has(it.type)){
    const png=await api.osThumb(it.path,TH);
    if(png) bmp=await createImageBitmap(new Blob([png],{type:'image/png'}));
    else if(it.type==='pdf') bmp=await pdfThumb(it);
    else { const r=await decode(ref(it),'embedded',0); bmp=await toBitmap(r); }
    if(!bmp) throw new Error('brak podglądu — '+(api.web?'w przeglądarce tylko w programie':'otwórz w programie'));
    it.meta={format:TLABEL(it.type),mode:it.type==='pdf'?(it.pages?it.pages+' '+plural(it.pages,'strona','strony','stron'):''):(png?'':'podgląd zapisany w pliku')};
    const c=document.createElement('canvas'), s=Math.min(1,TH/Math.max(bmp.width,bmp.height));
    c.width=Math.max(1,Math.round(bmp.width*s)); c.height=Math.max(1,Math.round(bmp.height*s));
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.imageSmoothingQuality='high'; g.drawImage(bmp,0,0,c.width,c.height); bmp.close();
    it.thumb=c;
    c.toBlob(b=>{ if(b) b.arrayBuffer().then(buf=>api.thumbPut(key,buf,null,it.meta)).then(()=>newThumbs++); },'image/webp',0.85);
    return;
  }
  if(it.type==='svg'){const im=await loadImg(api.fileUrl(it.path));const w=im.naturalWidth||1024,h=im.naturalHeight||1024;
    const k=Math.min(4,TH*2/Math.max(w,h));const c=new OffscreenCanvas(Math.round(w*k),Math.round(h*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    bmp=c.transferToImageBitmap();it.dims=[w,h];}
  else if(NATIVE.has(it.type)){bmp=await createImageBitmap(await blobOf(it));it.dims=[bmp.width,bmp.height];}
  else{
    if(it.type==='psd'&&!it.thumb){ // od razu mała miniatura zapisana w PSD, potem ostra
      try{const q=await decode(ref(it),'psdthumb',0); const b=await toBitmap(q); const c=document.createElement('canvas');c.width=b.width;c.height=b.height;c.getContext('2d').drawImage(b,0,0);b.close();
        it.thumb=c; it.dims=[q.meta.width,q.meta.height]; it.meta=q.meta; if(it.tile&&it.tile.isConnected) paint(it);}catch(e){}
    }
    const r=await decode(ref(it),it.type,TH*2);it.meta=r.meta;it.dims=[r.meta.width,r.meta.height];bmp=await toBitmap(r);}
  const s=Math.min(1,TH/Math.max(bmp.width,bmp.height));
  const w=Math.max(1,Math.round(bmp.width*s)),h=Math.max(1,Math.round(bmp.height*s));
  const small=s<1?await createImageBitmap(bmp,{resizeWidth:w,resizeHeight:h,resizeQuality:'high'}):bmp;
  let c;
  if(OPAQUE.has(it.type)){c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(small,0,0);}
  else c=paintOn(small,w,h,Math.max(4,Math.round(Math.max(w,h)/48)));
  if(small!==bmp)small.close(); bmp.close();
  it.thumb=c;
  c.toBlob(b=>{ if(b) b.arrayBuffer().then(buf=>api.thumbPut(key,buf,it.dims,it.meta||null)).then(()=>newThumbs++); },'image/webp',0.82);
}
function videoFrame(url){
  return new Promise((res,rej)=>{
    const v=document.createElement('video'); v.muted=true; v.preload='auto'; v.crossOrigin='anonymous';
    let done=false; const end=(e,r)=>{if(done)return;done=true;clearTimeout(t);v.removeAttribute('src');v.load();e?rej(e):res(r);};
    const t=setTimeout(()=>end(new Error('limit czasu')),12000);
    v.onerror=()=>end(new Error('kodek'));
    v.onloadedmetadata=()=>{ if(!v.videoWidth) return end(new Error('brak obrazu')); v.currentTime=Math.min((v.duration||0)*0.1,8); };
    v.onseeked=async()=>{try{const b=await createImageBitmap(v);end(null,{bmp:b,dur:v.duration,w:v.videoWidth,h:v.videoHeight});}catch(e){end(e);}};
    v.src=url;
  });
}
// PDF: pierwsza strona rysowana przez pdf.js (tylko w programie — biblioteka jest dołączana przy budowaniu)
let pdfjs=null, pdfjsTried=false;
async function pdfThumb(it){
  if(api.web) throw new Error('miniatury PDF są w programie; dwuklik otwiera dokument');
  if(!pdfjsTried){ pdfjsTried=true; try{ pdfjs=await import('../node_modules/pdfjs-dist/build/pdf.min.mjs'); pdfjs.GlobalWorkerOptions.workerSrc='../node_modules/pdfjs-dist/build/pdf.worker.min.mjs'; }catch(e){ pdfjs=null; } }
  if(!pdfjs) throw new Error('brak podglądu PDF');
  const data=new Uint8Array(await (await blobOf(it)).arrayBuffer());
  const doc=await pdfjs.getDocument({data,isEvalSupported:false}).promise;
  try{
    const page=await doc.getPage(1), v1=page.getViewport({scale:1});
    const vp=page.getViewport({scale:Math.min(4,TH*1.5/Math.max(v1.width,v1.height))});
    const c=document.createElement('canvas'); c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height);
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:g,viewport:vp}).promise;
    it.pages=doc.numPages;
    return await createImageBitmap(c);
  } finally { doc.destroy(); }
}
async function loadImg(url){const im=new Image();im.crossOrigin='anonymous';im.src=url;await im.decode();return im;}
// szachownica pod przezroczystymi pikselami
let chkTile=null;
function paintOn(bmp,w,h,cell){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  if(!chkTile){chkTile=document.createElement('canvas');chkTile.width=chkTile.height=2;const t=chkTile.getContext('2d');t.fillStyle='#fff';t.fillRect(0,0,2,2);t.fillStyle='#d4d4d4';t.fillRect(1,0,1,1);t.fillRect(0,1,1,1);}
  const p=g.createPattern(chkTile,'repeat');p.setTransform(new DOMMatrix().scale(cell));g.imageSmoothingEnabled=false;
  g.fillStyle=p;g.fillRect(0,0,w,h);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
  g.drawImage(bmp,0,0,w,h);return c;
}
function toBitmap(r){
  if(r.img) return createImageBitmap(new Blob([r.img],{type:r.mime}));
  return r.jpeg?createImageBitmap(new Blob([r.jpeg],{type:'image/jpeg'})):createImageBitmap(new ImageData(r.data,r.width,r.height));
}

/* --- wątki robocze do PSD, TIFF, EXR, HDR, TGA, RAW --- */
const pool=[], jobs=new Map(); let jobId=0, lib=null;
const direct=(r,t,m)=>(lib=lib||decoderLib()).decode(asFile(r),t,m);
try{
  const src='const asFile='+asFile.toString()+';const lib=('+decoderLib.toString()+')();self.onmessage=async e=>{const{id,file,type,max}=e.data;try{const r=await lib.decode(asFile(file),type,max);self.postMessage({id,r},r.data?[r.data.buffer]:[])}catch(err){self.postMessage({id,error:String(err&&err.message||err)})}}';
  const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
  for(let i=0;i<MAXRUN;i++){
    const w=new Worker(url); w.busy=0;
    w.onmessage=e=>{const j=jobs.get(e.data.id);if(!j)return;jobs.delete(e.data.id);w.busy--;e.data.error?j.rej(new Error(e.data.error)):j.res(e.data.r);};
    w.onerror=ev=>{ev.preventDefault();const k=pool.indexOf(w);if(k>=0)pool.splice(k,1);
      for(const [id,j] of jobs) if(j.w===w){jobs.delete(id);direct(j.f,j.t,j.m).then(j.res,j.rej);}};
    pool.push(w);
  }
}catch(e){}
function decode(f,t,m){
  if(!pool.length) return direct(f,t,m);
  const w=pool.reduce((a,b)=>a.busy<=b.busy?a:b); w.busy++;
  return new Promise((res,rej)=>{const id=++jobId;jobs.set(id,{res,rej,w,f,t,m});w.postMessage({id,file:f,type:t,max:m});});
}

/* --- podgląd powiększony: natychmiast miniatura, potem pełny obraz; sąsiedzi wczytywani z wyprzedzeniem --- */
const viewer=$('#viewer'), stage=$('#stage');
let vTok=0, vEl=null, actual=false, vList=[], vi=0, lastStep=0;
const vCache=new Map(); // pełne obrazy ostatnio oglądane i wczytane z wyprzedzeniem
const VC_PX=180e6;      // limit pamięci podglądów (w pikselach)
const bigCell=(w,h)=>Math.max(8,Math.round(Math.max(w,h)/80));
const vpx=v=>v.media?0:(v.el.naturalWidth||v.el.width)*(v.el.naturalHeight||v.el.height);
const vLoading=new Map();
function fullOf(it){
  if(vCache.has(it)){const v=vCache.get(it);vCache.delete(it);vCache.set(it,v);return Promise.resolve(v);}
  if(vLoading.has(it)) return vLoading.get(it);
  const p=(async()=>{
    let v;
    if(it.type==='vid'){
      const el=document.createElement('video'); el.src=api.fileUrl(it.path); el.controls=true; el.preload='metadata'; el.loop=true; el.className='vid'; el.playsInline=true;
      await new Promise((ok,no)=>{el.onloadedmetadata=ok;el.onerror=()=>no(new Error('tego formatu nie da się tu odtworzyć — otwórz w programie (E)'));});
      it.dims=[el.videoWidth,el.videoHeight]; v={el,note:'',media:true};
    }else if(it.type==='pdf'){ // cały dokument we wbudowanej przeglądarce PDF
      const el=document.createElement('iframe'); el.src=api.fileHref(it.path); el.className='doc'; el.title=it.name;
      v={el,note:'',doc:true};
    }else if(DOCS.has(it.type)){ // model / rysunek: powiększony podgląd zapisany w pliku
      await thumbOf(it).catch(()=>{});
      if(!it.thumb) throw new Error('brak podglądu — otwórz plik w programie');
      const el=document.createElement('canvas'); el.width=it.thumb.width; el.height=it.thumb.height; el.getContext('2d').drawImage(it.thumb,0,0);
      el.className='docthumb'; v={el,note:'pełny plik otworzysz w programie (E)',doc:true};
    }else if(NATIVE.has(it.type)&&it.type!=='jpg'&&it.type!=='gif'&&it.type!=='svg'){
      const bmp=await createImageBitmap(await blobOf(it)); it.dims=[bmp.width,bmp.height];
      v={el:paintOn(bmp,bmp.width,bmp.height,bigCell(bmp.width,bmp.height)),note:''}; bmp.close();
    }else if(NATIVE.has(it.type)){
      const el=await loadImg(api.fileUrl(it.path));
      if(el.naturalWidth) it.dims=[el.naturalWidth,el.naturalHeight];
      if(it.type==='svg'&&!el.naturalWidth){el.style.width='80%';}
      v={el,note:''};
    }else{
      const r=await decode(ref(it),it.type,0);
      it.meta=r.meta; it.dims=[r.meta.width,r.meta.height];
      const bmp=await toBitmap(r); let el;
      if(OPAQUE.has(it.type)||r.jpeg){el=document.createElement('canvas');el.width=bmp.width;el.height=bmp.height;el.getContext('2d').drawImage(bmp,0,0);}
      else el=paintOn(bmp,bmp.width,bmp.height,bigCell(bmp.width,bmp.height));
      bmp.close(); v={el,note:r.note||''};
    }
    if(v.media) return v; // filmów nie trzymamy w pamięci
    vCache.set(it,v);
    let tot=0; for(const x of vCache.values()) tot+=vpx(x);
    for(const k of vCache.keys()){ if(tot<=VC_PX||vCache.size<=2) break; if(vList[vi]===k) continue; tot-=vpx(vCache.get(k)); vCache.delete(k); }
    return v;
  })().finally(()=>vLoading.delete(it));
  vLoading.set(it,p); return p;
}
function openViewer(it){
  const files=view.filter(x=>x.kind==='file');
  vList=picked.size>1&&picked.has(it)?files.filter(x=>picked.has(x)):files;

function stopMedia(){for(const m of stage.querySelectorAll('video'))m.pause();}
function mount(el,low,it){

  el.classList.toggle('low',!!low);

async function showV(){
  const it=vList[vi]; if(!it) return; const tok=++vTok;
  const now=performance.now(), fast=now-lastStep<180; lastStep=now;
  const i=view.indexOf(it); if(i>=0&&picked.size<=1) select(i); else if(i>=0){sel=i;}
  $('#vname').textContent=it.name; $('#vname').title=it.path; $('#vinfo').textContent=info(it); $('#vcount').textContent=(vi+1)+' / '+vList.length;
  stage.className=actual?'actual':'fit';
  if(vCache.has(it)){ const v=await fullOf(it); if(tok!==vTok) return; mount(v.el,false,it); afterShow(it,v,tok); return; }
  // od razu: miniatura z pamięci
  if(it.thumb){ const c=document.createElement('canvas'); c.width=it.thumb.width; c.height=it.thumb.height; c.getContext('2d').drawImage(it.thumb,0,0); mount(c,true,it); }
  else { stage.innerHTML='<div class="msg">Wczytywanie…</div>'; vEl=null; enqueue(it,true,true); }
  // przy szybkim przewijaniu czekamy chwilę, zanim zaczniemy dekodować pełny plik
  if(fast){ await new Promise(r=>setTimeout(r,140)); if(tok!==vTok) return; }
  let v;
  try{v=await fullOf(it);}catch(e){if(tok!==vTok)return;if(!it.thumb){stage.innerHTML='<div class="msg"></div>';stage.firstChild.textContent='Nie udało się otworzyć: '+(e.message||e);}else $('#vinfo').textContent=info(it)+'  ·  '+(e.message||e);return;}
  if(tok!==vTok) return;

function afterShow(it,v,tok){
  $('#vinfo').textContent=info(it)+(v.note?'  ·  '+v.note:''); status();
  // wczytaj z wyprzedzeniem: następny, poprzedni, jeszcze jeden dalej
  setTimeout(async()=>{
    const n=vList.length;
    for(const d of [1,-1,2,3]){
      if(tok!==vTok||n<2) return;
      const nx=vList[((vi+d)%n+n)%n]; if(nx===it) continue;
      if(!nx.thumb) enqueue(nx,true);
      try{await fullOf(nx);}catch(e){}

}
function stepV(d){if(!vList.length)return;vi=(vi+d+vList.length)%vList.length;showV();}
function applyZoom(tip){
  stage.className=actual?'actual':'fit';
  if(vEl&&vEl.tagName!=='VIDEO'){const w=(vEl.naturalWidth||vEl.width)/devicePixelRatio;vEl.style.width=actual?w+'px':'';vEl.style.height='';}
