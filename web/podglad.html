<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Podgląd (wersja w przeglądarce)</title>
<style>
:root{
  --bg:#f4f4f2; --side:#ecebe8; --panel:#fafaf9; --line:#dcdbd7; --text:#1d1d1b; --muted:#8a8984;
  --tile:#e6e5e1; --sel:#d6d5cf; --selh:#e3e2dd; --btn:#fff; --btnh:#f0efec; --on:#e2e1dc; --accent:#1d1d1b; --stage:#e9e8e4;
  --tile-w:180px; --lic:28px; color-scheme:light;
}
[data-theme=dark]{
  --bg:#1b1b1b; --side:#202020; --panel:#232323; --line:#323232; --text:#dedede; --muted:#7d7d7d;
  --tile:#242424; --sel:#383838; --selh:#2a2a2a; --btn:#2b2b2b; --btnh:#333; --on:#3a3a3a; --accent:#e8e8e8; --stage:#121212;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:210px 1fr;grid-template-rows:auto 1fr auto;height:100vh}
button{font:inherit;color:var(--text);background:var(--btn);border:1px solid var(--line);border-radius:3px;padding:0 10px;height:28px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){background:var(--btnh)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--muted);outline-offset:1px}
main:focus-visible{outline:none}

/* pasek boczny */
aside{grid-row:1/4;background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:16px 0}
aside h2{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 16px 6px}
.nav{list-style:none;margin:0;padding:0}
.nav li{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 16px;cursor:pointer}
.nav li:hover{background:var(--btnh)}
.nav li.on{background:var(--sel)}
.nav li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav li .x{flex:none;opacity:0;color:var(--muted);border:0;background:none;height:auto;padding:0 2px}
.nav li:hover .x{opacity:1}
.nav li.none{color:var(--muted);cursor:default}
.nav li.none:hover{background:none}
#side-open{margin:12px 16px 0;width:calc(100% - 32px)}
.cachebox{margin:20px 16px 0;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cachebox button{height:22px;font-size:12px;padding:0 8px}

/* pasek górny: wszystko w jednej linii */
header{background:var(--panel);border-bottom:1px solid var(--line);padding:9px 16px;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0}
header>*{flex:none}
header>#crumbs{flex:0 1 auto}
.ico{width:28px;padding:0;text-align:center}
#crumbs{display:flex;align-items:center;margin:0 4px;font-size:13px;font-weight:400;min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden}
#crumbs a{color:var(--muted);cursor:pointer;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
#crumbs a:hover{color:var(--text)}
#crumbs span{font-weight:600;flex:0 0 auto}
#fav.on{color:#c9a227}
.gap{flex:1 1 0}
.search{display:inline-flex;align-items:center;position:relative}
.search input{font:inherit;color:var(--text);background:var(--btn);border:1px solid var(--line);border-radius:3px;padding:0 84px 0 9px;height:28px;width:230px;outline:0}
.search input:focus{border-color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
#qClear{position:absolute;right:58px;border:0;background:none;height:24px;padding:0 6px;color:var(--muted)}
#qScope{position:absolute;right:3px;height:22px;padding:0 7px;font-size:11px;border:0;border-radius:2px;background:var(--tile);color:var(--muted);min-width:52px}
#qScope[aria-pressed=true]{background:var(--on);color:var(--text)}
#deepChip{background:var(--on);font-size:12px;height:26px}
div.grp{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;padding:18px 4px 6px;margin:0 3px 4px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
div.grp:first-child{padding-top:2px}
.grp b{color:var(--text);font-weight:600;font-size:13px;cursor:pointer}
.grp b:hover{text-decoration:underline;text-underline-offset:3px}
tr.grp td{padding:18px 8px 6px;background:none!important;color:var(--muted);font-size:12px}
tr.grp td b{margin-right:10px}
.web #cacheDir,.web #cacheShow{display:none}
#typesBtn.on{background:var(--on)}
.sortw{display:inline-flex}
select{font:inherit;color:var(--text);background:var(--btn);border:1px solid var(--line);border-radius:3px 0 0 3px;height:28px;padding:0 6px;outline:0}
#sortDir{border-radius:0 3px 3px 0;margin-left:-1px}
.zoom{display:inline-flex;align-items:center;gap:0}
.zoom button{width:22px;padding:0;border:0;background:none;color:var(--muted);font-size:15px}
.zoom button:hover:not(:disabled){background:none;color:var(--text)}
.zoom input{width:96px;accent-color:var(--accent)}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px;color:var(--muted);width:30px;padding:0}
.seg button:first-child{border-radius:3px 0 0 3px;margin-left:0}
.seg button:last-child{border-radius:0 3px 3px 0}
.seg button[aria-pressed=true]{background:var(--on);color:var(--text)}
/* drzewo folderów */
aside h2+.nav{margin-bottom:18px}
.tree li{padding-left:0}
.tree .tw{flex:none;width:14px;text-align:center;color:var(--muted);font-size:10px;cursor:pointer}
.tree .tw:hover{color:var(--text)}
.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
body.nonames .tile .nm,body.nonames .tile .sub{display:none}

/* siatka */
main{overflow:auto;padding:14px;position:relative;outline:none}
#grid.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(var(--tile-w),100%),1fr));gap:4px}
#grid.list{display:block}
.tile{padding:7px;border-radius:4px;min-width:0;cursor:default}
.tile.sel{background:var(--sel)}
.tile .box{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;border-radius:2px}
.tile canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;transition:transform .16s ease;will-change:transform}
.tile:hover canvas{transform:scale(1.04)}
.tile.dir .box{background:var(--tile)}
.tile.dir:hover canvas{transform:scale(1.06)}
.tile:not(.dir) .box:has(.ph){background:var(--tile)}
.tile .nm{display:block;margin-top:6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.tile .sub{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px}
.ph{color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase}

/* foldery w siatce */
.tile.dir .box{overflow:hidden}
.tile.dir .box canvas{object-fit:cover}
.tile.dir .box::after{content:'';position:absolute;inset:0;border:1px solid var(--line);border-radius:2px;pointer-events:none}
.tile.dir .nm{font-weight:600}
.tile.dir .ph{font-size:18px}
.sk{position:absolute;left:4px;right:4px;bottom:4px;display:flex;gap:2px;height:3px;opacity:0;transition:opacity .15s;z-index:1}
.sk i{flex:1;background:rgba(255,255,255,.45);border-radius:1px}
.sk i.on{background:#fff}
.cnt{position:absolute;right:5px;top:5px;font-size:10px;padding:1px 5px;border-radius:2px;background:rgba(0,0,0,.55);color:#fff;font-variant-numeric:tabular-nums;pointer-events:none;z-index:1;opacity:0}
.tile.dir .box:hover .sk,.tile.dir .box:hover .cnt{opacity:1}

/* lista */
.list{width:100%;border-collapse:collapse}
.list th{font-weight:400;color:var(--muted);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.list th button{border:0;background:none;height:auto;padding:0;color:inherit}
.list th.on button{color:var(--text)}
.list td{padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.list td.num,.list th.num{text-align:right;font-variant-numeric:tabular-nums}
.list td.m{color:var(--muted)}
.list tr:hover td{background:var(--selh)}
.list tr.sel td{background:var(--sel)}
.list .cell{display:flex;align-items:center;min-width:0}
.list .ic{flex:none;width:calc(var(--lic)*4/3);height:var(--lic);margin-right:10px;background:var(--tile);display:flex;overflow:hidden;border-radius:2px}
.list .ic canvas{width:100%;height:100%;object-fit:cover;display:block}
.list .nm{overflow:hidden;text-overflow:ellipsis}
.list .nm i{font-style:normal;color:var(--muted)}

#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center;padding:20px}
footer{grid-column:2;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:0 16px;height:30px;border-top:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12px;white-space:nowrap;min-width:0}
#status{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
#status b{color:var(--text);font-weight:500}
.toggle{display:inline-flex;flex:none}
.toggle button{height:20px;font-size:11px;padding:0 7px;border-radius:0;margin-left:-1px;color:var(--muted)}
.toggle button:first-child{border-radius:3px 0 0 3px;margin-left:0}
.toggle button:last-child{border-radius:0 3px 3px 0}
.toggle button[aria-pressed=true]{background:var(--on);color:var(--text)}

/* podgląd */
#viewer{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10}
#viewer.open{display:flex}
#viewer .top{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;padding:10px 14px 6px;white-space:nowrap}
#viewer .top .ico{border:0;background:var(--tile);width:32px;height:30px;font-size:17px;color:var(--text)}
#viewer .top .ico:hover{background:var(--sel)}
.vt{text-align:center;min-width:0;line-height:1.3}
#vname{font-weight:500;overflow:hidden;text-overflow:ellipsis}
#vinfo{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis}
#vcount{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
#stage{flex:1;overflow:auto;position:relative;display:flex}
#stage.fit>*{position:absolute;inset:14px 64px 24px;width:calc(100% - 128px);height:calc(100% - 38px);object-fit:scale-down;cursor:zoom-in}
#stage.fit>.low{margin:auto;object-fit:fill;filter:blur(.4px)}
#stage.actual>*{margin:auto;flex:none;cursor:zoom-out}
#stage .msg{margin:auto;color:var(--muted);position:static!important;width:auto!important;height:auto!important}
#viewer .navb{position:absolute;top:calc(50% - 28px);width:44px;height:56px;border:0;background:none;color:var(--muted);font-size:20px;z-index:2;opacity:0;transition:opacity .2s}
#viewer:hover .navb{opacity:1}
#viewer .navb:hover{background:none;color:var(--text)}
#vprev{left:10px} #vnext{right:10px}
/* Tab: sam obraz, bez interfejsu */
body.bare{grid-template-columns:1fr}
body.bare aside,body.bare header,body.bare footer,body.bare #viewer .top{display:none}
body.bare #grid .nm,body.bare #grid .sub{display:none}

/* menu, podpowiedź, upuszczanie */
.ctx{position:fixed;z-index:60;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.ctx[hidden]{display:none}
.ctx button{display:block;width:100%;text-align:left;border:0;background:none;height:auto;padding:5px 10px;border-radius:3px}
.ctx button:hover,.ctx button:focus{background:var(--sel);outline:0}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.ctx .ch{padding:4px 10px 6px;color:var(--muted);font-size:12px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zoomtip{position:fixed;left:calc(50% + 105px);bottom:50px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:4px 10px;border-radius:3px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70}
.zoomtip.on{opacity:1}
.dropzone{display:none;position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 85%,transparent);pointer-events:none}
.dropzone span{position:absolute;inset:16px;border:2px dashed var(--muted);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
body[data-drop] .dropzone{display:block}

/* program */
#crumbs i{font-style:normal;color:var(--muted);margin:0 6px;flex:none}
#crumbs a{min-width:24px}
.tree li.drive span:last-child{color:var(--muted)}
.cachebox{margin:18px 0 0;padding:0 16px;display:block;color:var(--muted);font-size:12px}
.cachebox h2{margin:0 0 6px}
.cachebox .cinfo{margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cachebox .crow{display:flex;gap:4px;margin-bottom:6px;align-items:center;flex-wrap:wrap}
.cachebox .crow label{display:flex;align-items:center;gap:6px}
.cachebox select{height:22px;font-size:12px;border-radius:3px;padding:0 4px}
.cachebox button{height:22px;font-size:12px;padding:0 8px}
#prog{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ctx kbd{float:right;margin-left:24px;font:inherit;font-size:11px;color:var(--muted)}
.ctx button:hover kbd{color:inherit}
aside{display:flex;flex-direction:column}
aside .tree{flex:1 1 auto;overflow:auto;min-height:80px}
#side-open{flex:none}
</style>
</head>
<body>


<aside>
  <h2>Ulubione</h2>
  <ul class="nav" id="favs"></ul>
  <h2>Foldery</h2>
  <ul class="nav tree" id="tree"></ul>
  <button id="side-open">Otwórz folder…</button>
  <div class="cachebox">
    <h2>Pamięć miniatur</h2>
    <div id="cache" class="cinfo"></div>
    <div class="crow">
      <label>Limit <select id="cacheLimit">
        <option value="500">500 MB</option><option value="1024">1 GB</option><option value="2048">2 GB</option>
        <option value="5120">5 GB</option><option value="10240">10 GB</option><option value="20480">20 GB</option></select></label>
    </div>
    <div class="crow"><button id="cacheDir" title="Przenieś pamięć miniatur do innego folderu">Folder…</button><button id="cacheShow" title="Pokaż folder z miniaturami">Pokaż</button><button id="cacheClear">Wyczyść</button></div>
  </div>
</aside>

<header>
  <button id="up" class="ico" title="Folder wyżej (Backspace)" disabled>↑</button>
  <h1 id="crumbs"></h1>
  <button id="fav" class="ico" title="Dodaj ten folder do ulubionych" disabled>☆</button>
  <button id="deepChip" hidden title="Wróć do zwykłego widoku folderu (W)">Wszystko w środku ✕</button>
  <span class="gap"></span>
  <label class="search"><input id="q" type="search" placeholder="Szukaj" autocomplete="off" spellcheck="false"><button type="button" id="qClear" hidden title="Wyczyść">×</button><button type="button" id="qScope"></button></label>
  <button id="typesBtn" title="Pokaż lub ukryj typy plików">Typy ▾</button>
  <span class="sortw"><select id="sortSel" title="Sortowanie">
    <option value="name">Nazwa</option><option value="date">Data</option><option value="size">Rozmiar pliku</option><option value="dims">Wymiary</option><option value="type">Rodzaj</option>
  </select><button id="sortDir" class="ico" title="Odwróć kolejność">↑</button></span>
  <span class="zoom"><button id="zminus" title="Mniejsze miniatury (−)">−</button><input type="range" id="size" min="90" max="420" step="10" aria-label="rozmiar miniatur"><button id="zplus" title="Większe miniatury (+)">+</button></span>
  <span class="seg" id="mode"><button data-v="icons" title="Ikony (L)">▦</button><button data-v="list" title="Lista (L)">☰</button></span>
  <button id="refresh" class="ico" title="Odśwież (R)" disabled>⟳</button>
</header>

<main id="main" tabindex="0">
  <div id="grid"></div>
  <div id="empty">
    <div>Wybierz folder z lewej, otwórz go albo przeciągnij tutaj.<br><br>JPG · PNG · PSD · TIFF · TGA · EXR · HDR · RAW · WebP · AVIF · GIF · BMP · SVG</div>
    <button id="empty-open">Otwórz folder…</button>
  </div>
</main>

<footer>
  <span id="status"></span>
  <span id="prog"></span>
  <label class="chk" title="Pokazuj nazwy plików pod miniaturami (N)"><input type="checkbox" id="names"> Nazwy</label>
  <span class="toggle" id="themeT"><button data-th="auto">Auto</button><button data-th="light">Jasny</button><button data-th="dark">Ciemny</button></span>
</footer>

<div class="ctx" id="ctx" hidden role="menu"></div>
<div class="dropzone" aria-hidden="true"><span>Upuść folder, żeby go otworzyć</span></div>

<div id="viewer" role="dialog" aria-modal="true">
  <div class="top">
    <button id="vclose" class="ico" title="Wróć do siatki (spacja / Esc)">‹</button>
    <div class="vt"><div id="vname"></div><div id="vinfo"></div></div>
    <span id="vcount"></span>
    <button id="vmore" class="ico" title="Więcej">⋯</button>
  </div>
  <div id="stage" class="fit"></div>
  <button class="navb" id="vprev" title="Poprzedni (←)">←</button>
  <button class="navb" id="vnext" title="Następny (→)">→</button>
</div>

<script>
/* Podgląd w przeglądarce: zastępuje most Electronu (preload.js).
   Foldery otwierane przez File System Access API (Chrome/Edge), miniatury w IndexedDB.
   Ścieżki są wirtualne: /<nazwa folderu>/podfolder/plik. */
(()=>{
  if(window.api) return;
  const handles=new Map();   // ścieżka → uchwyt folderu lub pliku
  const files=new Map();     // ścieżka → File
  const urls=new Map();      // ścieżka → blob: URL
  let roots=[];              // [{name,path,handle}]
  let tip=null;
  const say=t=>{ if(typeof zoomTip==='function') zoomTip(t); };
  const onlyApp=()=>say('Dostępne w programie Podgląd');

  const db=new Promise((res,rej)=>{const r=indexedDB.open('podglad-web',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('roots',{keyPath:'name'});d.createObjectStore('thumbs',{keyPath:'k'}).createIndex('t','t');};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
  const tx=async(store,mode,fn)=>{const d=await db;return new Promise((res,rej)=>{const t=d.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});};

  const dirname=p=>{const s=p.replace(/\/+$/,'');const i=s.lastIndexOf('/');return i<=0?'/':s.slice(0,i);};
  const basename=p=>p.replace(/\/+$/,'').split('/').pop()||'/';
  const join=(a,b)=>a.replace(/\/+$/,'')+'/'+b;

  async function permitted(h,ask){
    try{ let p=await h.queryPermission({mode:'read'}); if(p!=='granted'&&ask) p=await h.requestPermission({mode:'read'}); return p==='granted'; }catch(e){ return true; }
  }
  async function loadRoots(){
    try{ const rs=await tx('roots','readonly',s=>s.getAll())||[]; for(const r of rs){ const p='/'+r.name; if(!roots.find(x=>x.path===p)){ roots.push({name:r.name,path:p,handle:r.handle}); handles.set(p,r.handle);} } }catch(e){}
  }
  async function addRoot(h){
    for(const r of roots){ try{ if(await r.handle.isSameEntry(h)) return r.path; }catch(e){} }
    let name=h.name, k=2; while(roots.find(r=>r.name===name)) name=h.name+' ('+(k++)+')';
    const p='/'+name; roots.push({name,path:p,handle:h}); handles.set(p,h);
    tx('roots','readwrite',s=>s.put({name,handle:h})).catch(()=>{});
    return p;
  }
  // uchwyt dla ścieżki: korzeń + kolejne podfoldery
  async function resolve(p,ask){
    if(handles.has(p)){ const h=handles.get(p); const r=roots.find(x=>p===x.path||p.startsWith(x.path+'/')); if(r&&!(await permitted(r.handle,ask))) return null; return h; }
    const r=roots.find(x=>p===x.path||p.startsWith(x.path+'/')); if(!r) return null;
    if(!(await permitted(r.handle,ask))) return null;
    let h=r.handle, acc=r.path;
    for(const seg of p.slice(r.path.length).split('/').filter(Boolean)){
      try{ h=await h.getDirectoryHandle(seg); }catch(e){ return null; }
      acc+='/'+seg; handles.set(acc,h);
    }
    return h;
  }

  document.documentElement.classList.add('web');
  window.api={
    platform:/Mac/.test(navigator.platform)?'darwin':'win32', sep:'/', web:true,
    dirname, basename, parse:p=>{const r=roots.find(x=>p===x.path||p.startsWith(x.path+'/'));return {root:r?r.path+'/':'/'};},
    fileUrl:p=>{ if(urls.has(p)) return urls.get(p); const f=files.get(p); if(!f) return ''; const u=URL.createObjectURL(f); urls.set(p,u); return u; },

    async list(dir,exts){
      const h=await resolve(dir,true); if(!h) return {error:'brak dostępu do folderu',dirs:[],files:[]};
      const ok=new Set(exts||[]), ds=[], fs=[];
      try{
        for await(const e of h.values()){
          if(e.name.startsWith('.')) continue;
          const p=join(dir,e.name);

/* ===== Dekodery PSD i TGA (działają w wątku roboczym albo, awaryjnie, na stronie) ===== */

            for(let i=sppC;i<rowBytes;i++)b[a+i]=(b[a+i]+b[a+i-sppC])&255;
            tmp.set(b.subarray(a,a+rowBytes));
            for(let k=0;k<n;k++)for(let j=0;j<4;j++)b[a+k*4+j]=tmp[j*n+k];}
        }
        const d=dv(b), x0=tx*cw, x1=Math.min(W,x0+cw);
        for(let y=first;y<y1;y+=step){
          const oy=y/step, rb=(y-y0)*cw*sppC;
          for(let x=Math.ceil(x0/step)*step;x<x1;x+=step){
            const o=((oy*ow)+x/step)*4, si=rb+(x-x0)*sppC;
            if(planar===2){const m=map[plane];if(m>=0)out[o+m]=rv(b,d,si);}
            else for(let c=0;c<nCh;c++){const m=map[c];if(m>=0)out[o+m]=rv(b,d,si+c);}
          }
        }
      }
    }
    const cm=T[320], N=cm?cm.length/3:0;
    let anyA=false; if(hasA) for(let i=3;i<out.length;i+=4) if(out[i]){anyA=true;break;}
    for(let o=0;o<out.length;o+=4){
      if(photo<=1){const x=photo===0?255-out[o]:out[o];out[o]=out[o+1]=out[o+2]=x;}
      else if(photo===3&&cm){const i=out[o];out[o]=cm[i]>>8;out[o+1]=cm[N+i]>>8;out[o+2]=cm[2*N+i]>>8;}
      else if(photo===5){const k=255-out[o+3];out[o]=(255-out[o])*k/255;out[o+1]=(255-out[o+1])*k/255;out[o+2]=(255-out[o+2])*k/255;out[o+3]=255;}
      if(hasA&&!anyA) out[o+3]=255;
    }
    return {width:ow,height:oh,data:out,meta};
  }

  // --- OpenEXR: linie skanowania, bez kompresji, RLE, ZIPS, ZIP; half i float
  function exrUndo(t){
    for(let i=1;i<t.length;i++) t[i]=(t[i-1]+t[i]-128)&255;
    const o=new Uint8Array(t.length), h=(t.length+1)>>1;
    for(let i=0;i<t.length;i++) o[i]=(i&1)?t[h+(i>>1)]:t[i>>1];
    return o;
  }
  function exrRLE(src,need){
    const o=new Uint8Array(need); let p=0,q=0;
    while(p<src.length&&q<need){let l=src[p++];if(l>127)l-=256;
      if(l<0){for(let k=0;k<-l&&q<need;k++)o[q++]=src[p++];}
      else{const x=src[p++];for(let k=0;k<=l&&q<need;k++)o[q++]=x;}}
    return o;
  }
  async function decodeEXR(u,max){
    const v=dv(u);
    if(u.length<8||v.getUint32(0,true)!==20000630) throw new Error('To nie jest plik EXR');
    const ver=v.getUint32(4,true);
    if(ver&0x200) throw new Error('kafelkowy EXR nieobsługiwany');
    if(ver&0x1000) throw new Error('wieloczęściowy EXR nieobsługiwany');
    let p=8; const str=()=>{let s='';while(p<u.length&&u[p])s+=String.fromCharCode(u[p++]);p++;return s;};
    const ch=[]; let comp=0, dw=null;
    for(let guard=0;guard<200;guard++){
      const name=str(); if(!name) break; str(); const size=v.getInt32(p,true); p+=4; const q=p;
      if(name==='channels'){let r=q;while(u[r]){let n='';while(u[r])n+=String.fromCharCode(u[r++]);r++;ch.push({name:n,type:v.getInt32(r,true)});r+=16;}}
      else if(name==='compression') comp=u[q];
      else if(name==='dataWindow') dw=[v.getInt32(q,true),v.getInt32(q+4,true),v.getInt32(q+8,true),v.getInt32(q+12,true)];
      p=q+size;
    }
    if(!dw||!ch.length) throw new Error('Uszkodzony plik EXR');
    const W=dw[2]-dw[0]+1, H=dw[3]-dw[1]+1;
    const CN=['brak','RLE','ZIPS','ZIP','PIZ','PXR24','B44','B44A','DWAA','DWAB'];
    const meta={format:'EXR',width:W,height:H,mode:CN[comp]||'',depth:ch.some(c=>c.type===2)?32:16};
    const LPB={0:1,1:1,2:1,3:16}[comp];
    if(!LPB) throw new Error('kompresja EXR '+(CN[comp]||comp)+' nieobsługiwana');
    const nb=Math.ceil(H/LPB), offs=[];
    for(let i=0;i<nb;i++) offs.push(Number(v.getBigUint64(p+i*8,true)));
    let lb=0; for(const c of ch){c.off=lb;lb+=W*(c.type===1?2:4);}
    const find=k=>ch.find(c=>c.name===k)||ch.find(c=>c.name.endsWith('.'+k));
    let R=find('R'),G=find('G'),Bc=find('B'); const Y=find('Y');
    if(!R||!G||!Bc){R=G=Bc=Y||ch[0];}
    const L=halfLUT(), {step,ow,oh,out}=sampler(W,H,max);
    for(const off of offs){
      if(off+8>u.length) continue;
      const y=v.getInt32(off,true)-dw[1], size=v.getInt32(off+4,true), lines=Math.min(LPB,H-y);
      if(y<0||lines<=0) continue;
      const first=Math.ceil(y/step)*step; if(first>=y+lines) continue;
      const need=lb*lines; let data=u.subarray(off+8,off+8+size);
      if(size<need) data=exrUndo(comp===1?exrRLE(data,need):await inflate(data,need));
      const d=dv(data);
      const val=(c,base,x)=>c.type===1?L[d.getUint16(base+c.off+x*2,true)]:c.type===2?tone(d.getFloat32(base+c.off+x*4,true)):Math.min(255,d.getUint32(base+c.off+x*4,true));
      for(let yy=first;yy<y+lines;yy+=step){
        const base=(yy-y)*lb, oy=yy/step;
        for(let ox=0;ox<ow;ox++){const x=ox*step,o=(oy*ow+ox)*4;out[o]=val(R,base,x);out[o+1]=val(G,base,x);out[o+2]=val(Bc,base,x);}
      }
    }
    return {width:ow,height:oh,data:out,meta};
  }

  // --- Radiance HDR (RGBE)
  function decodeHDR(u,max){
    let p=0; const line=()=>{let s='';while(p<u.length&&u[p]!==10)s+=String.fromCharCode(u[p++]);p++;return s;};
    if(!line().startsWith('#?')) throw new Error('To nie jest plik HDR');
    while(p<u.length) if(line().trim()==='') break;
    const r=line().trim().split(/\s+/);
    if(r[0]!=='-Y'||r[2]!=='+X') throw new Error('orientacja HDR nieobsługiwana');
    const H=+r[1], W=+r[3], {step,ow,oh,out}=sampler(W,H,max), sl=new Uint8Array(W*4);
    for(let y=0;y<H&&p<u.length;y++){
      if(W>=8&&W<32768&&u[p]===2&&u[p+1]===2&&!(u[p+2]&128)){
        p+=4;
        for(let c=0;c<4;c++){let x=0;while(x<W&&p<u.length){let n=u[p++];
          if(n>128){n-=128;const val=u[p++];for(let k=0;k<n&&x<W;k++)sl[(x++)*4+c]=val;}
          else for(let k=0;k<n&&x<W;k++)sl[(x++)*4+c]=u[p++];}}
      }else{sl.set(u.subarray(p,p+W*4));p+=W*4;}
      if(y%step) continue;
      const oy=y/step;
      for(let ox=0;ox<ow;ox++){const x=ox*step*4,e=sl[x+3],o=(oy*ow+ox)*4;
        if(!e){out[o]=out[o+1]=out[o+2]=0;continue;}
        const f=Math.pow(2,e-136); out[o]=tone(sl[x]*f);out[o+1]=tone(sl[x+1]*f);out[o+2]=tone(sl[x+2]*f);}
    }
    return {width:ow,height:oh,data:out,meta:{format:'HDR',width:W,height:H,depth:32,mode:'RGBE'}};
  }

  // --- RAW z aparatów: największy podgląd JPEG zapisany w pliku
  function jpegAt(u,p){
    let q=p+2,w=0,h=0;
    while(q+4<u.length){
      if(u[q]!==0xFF) return null;
      const m=u[q+1]; if(m===0xFF){q++;continue;}
      if(m===0xD8||m===0x01||(m>=0xD0&&m<=0xD7)){q+=2;continue;}
      const len=(u[q+2]<<8)|u[q+3];
      if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC){ if(m===0xC3) return null; h=(u[q+5]<<8)|u[q+6]; w=(u[q+7]<<8)|u[q+8]; }
      if(m===0xDA){let r=q+2+len;while(r+1<u.length){if(u[r]===0xFF&&u[r+1]===0xD9)return w&&h?{s:p,e:r+2,w,h}:null;r++;}return null;}
      q+=2+len;
    }
    return null;
  }
  function decodeRAW(u,name){
    let best=null;
    for(let p=0;p+3<u.length;p++){
      if(u[p]!==0xFF||u[p+1]!==0xD8||u[p+2]!==0xFF) continue;
      const j=jpegAt(u,p);
      if(j){ if(!best||j.w*j.h>best.w*best.h) best=j; p=j.e-1; }
    }
    if(!best) throw new Error('w pliku RAW nie ma podglądu JPEG');
    const ext=(name.split('.').pop()||'').toUpperCase();
    return {jpeg:u.slice(best.s,best.e),meta:{format:ext||'RAW',width:best.w,height:best.h,mode:'podgląd JPEG z pliku'}};
  }
  return {decode};
}

</script>
<script>
/* ===== Podgląd — interfejs ===== */
const $=s=>document.querySelector(s);
const EXT={jpg:'jpg',jpeg:'jpg',jpe:'jpg',jfif:'jpg',png:'png',psd:'psd',psb:'psd',tif:'tif',tiff:'tif',tga:'tga',exr:'exr',hdr:'hdr',
  webp:'webp',avif:'avif',gif:'gif',bmp:'bmp',dib:'bmp',ico:'ico',svg:'svg',
  dng:'raw',cr2:'raw',cr3:'raw',nef:'raw',nrw:'raw',arw:'raw',sr2:'raw',srf:'raw',orf:'raw',rw2:'raw',raf:'raw',pef:'raw',srw:'raw',
  '3fr':'raw',iiq:'raw',erf:'raw',kdc:'raw',mrw:'raw',rwl:'raw',x3f:'raw'};
const EXTS=Object.keys(EXT);
const TYPES=['jpg','png','psd','tif','tga','exr','hdr','raw','webp','avif','gif','bmp','ico','svg']; // kolejność filtrów
const NATIVE=new Set(['jpg','png','webp','avif','gif','bmp','ico','svg']);           // dekoduje silnik przeglądarki
const OPAQUE=new Set(['jpg','raw','hdr','exr']);                                     // nie mają przezroczystości
const on=t=>S.types[t]!==false;
const extOf=n=>{const i=n.lastIndexOf('.');return i<0?'':n.slice(i+1).toLowerCase();};
const coll=new Intl.Collator('pl',{numeric:true,sensitivity:'base'});
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l');
const plural=(n,a,b,c)=>n===1?a:(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?b:c;
const isMac=api.platform==='darwin', SEP=api.sep;
const FINDER=isMac?'Finderze':'Eksploratorze';
const TH=480;       // rozdzielczość miniatur w pikselach
const SKIM=12;      // ile obrazów folderu można przejrzeć na kafelku
const grid=$('#grid'), main=$('#main');

/* --- ustawienia (zapisywane lokalnie w programie) --- */
const S=Object.assign({types:{},sort:'name',dir:1,size:180,lic:28,mode:'icons',names:true,theme:null,favs:[],last:null},
  (()=>{try{return JSON.parse(localStorage.getItem('podglad')||'{}');}catch(e){return {};}})());
const save=()=>{try{localStorage.setItem('podglad',JSON.stringify(S));}catch(e){}};
const press=(b,v)=>b.setAttribute('aria-pressed',v?'true':'false');

function applyTheme(){
  const t=S.theme||'auto';
  const dark=t==='auto'?matchMedia('(prefers-color-scheme: dark)').matches:t==='dark';
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.querySelectorAll('#themeT button').forEach(b=>press(b,b.dataset.th===t));
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
document.querySelectorAll('#themeT button').forEach(b=>b.onclick=()=>{S.theme=b.dataset.th==='auto'?null:b.dataset.th;save();applyTheme();});
function cycleTheme(){S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();applyTheme();}

/* rozmiar miniatur: suwak, + i −, Ctrl/⌘ + kółko lub gest szczypania na gładziku */
function setSize(v,tip){
  if(S.mode==='list'){S.lic=Math.round(Math.max(16,Math.min(96,v)));document.documentElement.style.setProperty('--lic',S.lic+'px');if(tip)zoomTip(S.lic+' px');}
  else{S.size=Math.round(Math.max(90,Math.min(420,v)));$('#size').value=S.size;document.documentElement.style.setProperty('--tile-w',S.size+'px');
    if(tip){const n=cols();zoomTip(n+' '+plural(n,'kolumna','kolumny','kolumn'));}}
  save();
}
const zcur=()=>S.mode==='list'?S.lic:S.size;
const zstep=d=>setSize(zcur()*(d>0?1.15:1/1.15),true);
let tipEl=null,tipT=0;
function zoomTip(t){if(!tipEl){tipEl=document.createElement('div');tipEl.className='zoomtip';document.body.appendChild(tipEl);}
  tipEl.textContent=t;tipEl.classList.add('on');clearTimeout(tipT);tipT=setTimeout(()=>tipEl.classList.remove('on'),800);}
document.documentElement.style.setProperty('--lic',S.lic+'px');
setSize(S.size);
$('#size').oninput=e=>{S.mode==='list'?setSize(+e.target.value/6):setSize(+e.target.value);};
$('#zminus').onclick=()=>zstep(-1); $('#zplus').onclick=()=>zstep(1);
main.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();setSize(zcur()*Math.exp(-e.deltaY/100),true);},{passive:false});

/* filtry, sortowanie, widoki */
function typeCounts(){const n={}; for(const it of items) n[it.type]=(n[it.type]||0)+1; return n;}
function renderTypes(){
  const n=typeCounts(), present=TYPES.filter(t=>n[t]), hidden=present.filter(t=>!on(t)).length;
  const b=$('#typesBtn'); b.textContent=hidden?'Typy '+(present.length-hidden)+'/'+present.length+' ▾':'Typy ▾'; b.classList.toggle('on',!!hidden);
}
function refilter(){save();renderTypes();for(const d of dirs)resetDir(d);applyView(keep());}
function typesMenu(){
  const n=typeCounts(), r=$('#typesBtn').getBoundingClientRect();
  const present=TYPES.filter(t=>n[t]||!on(t));
  if(!present.length){showMenu(r.left,r.bottom+4,'Brak obrazów',[]);return;}
  showMenu(r.left,r.bottom+4,'Pokazuj typy',[
    ...present.map(t=>({label:(on(t)?'✓  ':'     ')+(t==='tif'?'tiff':t)+'  ('+(n[t]||0)+')',run:()=>{S.types[t]=!on(t);refilter();typesMenu();}})),
    '-',{label:'Pokaż wszystkie',run:()=>{S.types={};refilter();}}]);
}
$('#typesBtn').onclick=e=>{e.stopPropagation();ctx.hidden?typesMenu():hideMenu();};
const DEF_DIR={name:1,type:1,date:-1,size:-1,dims:-1};
function setSort(k){ if(S.sort===k) S.dir=-S.dir; else {S.sort=k;S.dir=DEF_DIR[k]||1;} save(); markSort(); applyView(keep()); }
function markSort(){$('#sortSel').value=S.sort;$('#sortDir').textContent=S.dir>0?'↑':'↓';$('#sortDir').title=S.dir>0?'Rosnąco — kliknij, żeby odwrócić':'Malejąco — kliknij, żeby odwrócić';}
$('#sortSel').onchange=e=>setSort(e.target.value);
$('#sortDir').onclick=()=>{S.dir=-S.dir;save();markSort();applyView(keep());};
function markModes(){
  document.querySelectorAll('#mode button').forEach(b=>press(b,b.dataset.v===S.mode));
  $('#size').min=S.mode==='list'?96:90; $('#size').max=S.mode==='list'?576:420;
  $('#size').value=S.mode==='list'?S.lic*6:S.size;
}
function setMode(m){if(S.mode===m)return;S.mode=m;save();markModes();render();}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>setMode(b.dataset.v));
function setNames(v){S.names=v;save();document.body.classList.toggle('nonames',!v);$('#names').checked=v;}
$('#names').onchange=e=>setNames(e.target.checked);

/* wyszukiwanie */
let qt=0;
$('#q').oninput=()=>{$('#qClear').hidden=!$('#q').value;clearTimeout(qt);qt=setTimeout(()=>applyView(keep()),120);};
$('#qClear').onclick=()=>{$('#q').value='';$('#qClear').hidden=true;applyView(keep());$('#q').focus();};
function markScope(){const b=$('#qScope');press(b,!!S.qAll);b.textContent=S.qAll?'wszędzie':'tu';b.title=S.qAll?'Szukam też w podfolderach — kliknij, żeby szukać tylko tutaj':'Szukam tylko w tym folderze — kliknij, żeby szukać też w podfolderach';}
$('#qScope').onclick=()=>{S.qAll=!S.qAll;save();markScope();if($('#q').value)applyView(keep());$('#q').focus();};
markScope();
$('#deepChip').onclick=()=>setDeep(false);

/* --- pamięć miniatur (folder na dysku, obsługuje ją proces główny) --- */
const fmtSize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':b<1073741824?(b/1048576).toLocaleString('pl',{maximumFractionDigits:1})+' MB':(b/1073741824).toLocaleString('pl',{maximumFractionDigits:1})+' GB';
async function cacheInfo(){
  const c=await api.cacheInfo();
  $('#cache').textContent=c.count.toLocaleString('pl')+' '+plural(c.count,'miniatura','miniatury','miniatur')+' · '+fmtSize(c.bytes);
  $('#cache').title=c.dir;
  $('#cacheLimit').value=String(c.limitMB);
}
let newThumbs=0; setInterval(()=>{if(newThumbs){newThumbs=0;cacheInfo();}},4000);
$('#cacheLimit').onchange=async e=>{await api.cacheLimit(+e.target.value);cacheInfo();};
$('#cacheDir').onclick=async()=>{const d=await api.cacheChoose(); if(d){zoomTip('Miniatury w: '+d);cacheInfo();}};
$('#cacheShow').onclick=()=>api.cacheReveal();
$('#cacheClear').onclick=async()=>{
  if(!confirm('Usunąć zapamiętane miniatury? Policzą się od nowa przy następnym otwarciu folderów.')) return;
  await api.cacheClear();
  for(const it of items){it.thumb=null;it.state=null;it._tp=null;}
  for(const d of dirs) resetDir(d);
  render(); prefetch(); cacheInfo();
};

/* --- pliki: odczyt przez protokół pgf:// (z zakresami, więc PSD czytamy kawałkami) --- */
const ref=f=>({name:f.name,size:f.size,url:api.fileUrl(f.path)});
function asFile(r){
  const rd=x=>{if(!x.ok)throw new Error('nie można odczytać pliku');return x.arrayBuffer();};
  const get=(a,b)=>{b=Math.min(b,r.size); if(a>=b) return Promise.resolve(new ArrayBuffer(0));
    return fetch(r.url,{headers:{Range:'bytes='+a+'-'+(b-1)}}).then(rd);};
  return {name:r.name,size:r.size,slice:(a,b)=>({arrayBuffer:()=>get(a,b===undefined?r.size:b)}),arrayBuffer:()=>fetch(r.url).then(rd)};
}
const blobOf=it=>fetch(api.fileUrl(it.path)).then(x=>{if(!x.ok)throw new Error('nie można odczytać pliku');return x.blob();});

/* --- ulubione --- */
const samePath=(a,b)=>a&&b&&(isMac?a===b:a.toLowerCase()===b.toLowerCase());
const findFav=p=>S.favs.find(f=>samePath(f.path,p));
function toggleFav(p){
  p=p||curPath; if(!p) return;
  const f=findFav(p);
  if(f) S.favs=S.favs.filter(x=>x!==f); else S.favs.push({name:api.basename(p)||p,path:p});
  save(); renderSide();
}
async function openFav(f){
  if(!(await api.exists(f.path))){status('Folderu „'+f.name+'” nie ma pod zapisaną ścieżką — mógł zostać przeniesiony.');return;}
  go(f.path);
}

/* --- foldery i pliki --- */
let curPath=null, dirs=[], items=[], view=[], sel=-1, anchor=-1, picked=new Set(), scanTok=0, gen=0;
// „wszystko w środku”: obrazy z podfolderów w jednej siatce, pogrupowane nagłówkami folderów
let deep=false, deepItems=null, deepFor=null, deepTok=0, heads=null;
const keep=()=>{const it=view[sel];return it?it.path:null;};

async function pickFolder(){ const p=await api.pickFolder(); if(p){ if(api.web) await loadRoots(); go(p); } }
function go(p,selectPath,inside){ curPath=p; S.last=p; save(); deep=!!inside; deepItems=null; deepFor=null; $('#q').value='';$('#qClear').hidden=true; markDeep(); scan(false,selectPath); }
function setDeep(v){ deep=v; markDeep(); applyView(keep()); main.scrollTop=0; prefetch(); }
function markDeep(){ const c=$('#deepChip'); c.hidden=!deep; }
async function scan(keepScroll,selectPath){
  if(!curPath) return;
  const tok=++scanTok, prevPath=selectPath||keep(), prevTop=main.scrollTop, here=curPath;
  if(keepScroll){ deepItems=null; deepFor=null; }
  status('Wczytywanie…');
  const r=await api.list(here,EXTS);
  if(tok!==scanTok) return;
  if(r.error){status('Błąd: '+r.error);}
  // zachowaj już policzone miniatury tych samych plików
  const old=new Map(items.map(it=>[it.path+'|'+it.size+'|'+it.mtime,it]));
  const oldDirs=new Map(dirs.map(d=>[d.path,d]));
  gen++;
  items=r.files.map(f=>{
    const o=old.get(f.path+'|'+f.size+'|'+f.mtime);
    if(o&&o.state==='done'){o.gen=gen;o.tile=null;return o;}
    return {kind:'file',name:f.name,path:f.path,size:f.size,mtime:f.mtime,type:EXT[extOf(f.name)],gen,state:null};
  });
  dirs=r.dirs.map(d=>oldDirs.get(d.path)&&keepScroll?Object.assign(oldDirs.get(d.path),{tile:null}):{kind:'dir',name:d.name,path:d.path,files:null,count:null,state:null})
    .sort((a,b)=>coll.compare(a.name,b.name));
  renderTypes();
  applyView(prevPath);
  renderSide(); renderCrumbs(); syncTree();
  main.scrollTop=keepScroll?prevTop:0;
  if(sel>=0&&view[sel].tile&&!keepScroll) view[sel].tile.scrollIntoView({block:'center'});
  api.watch(here);
  prefetch();
}

}
// wczytanie całego drzewa pod bieżącym folderem
async function loadDeep(){
  if(deepFor===curPath&&deepItems) return true;
  const here=curPath, tok=++deepTok, out=[], known=new Map(items.map(it=>[it.path,it]));
  const base=here.replace(/[\\/]+$/,'');
  const relOf=p=>{const d=api.dirname(p); return d.length>base.length?d.slice(base.length+1):'';};
  let queue=[here], n=0;
  while(queue.length){
    const batch=queue.splice(0,6);
    const res=await Promise.all(batch.map(d=>api.list(d,EXTS)));
    if(tok!==deepTok||here!==curPath) return false;
    for(const r of res){
      for(const f of r.files){
        const o=known.get(f.path);
        const it=o&&o.size===f.size&&o.mtime===f.mtime?o:{kind:'file',name:f.name,path:f.path,size:f.size,mtime:f.mtime,type:EXT[extOf(f.name)],gen,state:null};
        it.rel=relOf(f.path); out.push(it);
      }
      for(const d of r.dirs) queue.push(d.path);
    }
    n=out.length; status('Wczytywanie podfolderów… '+n+' '+plural(n,'obraz','obrazy','obrazów'));
    if(out.length>40000) break;
  }
  deepItems=out; deepFor=here; return true;
}

  for(const seg of p.slice(pr.root.length).split(/[\\/]+/).filter(Boolean)){ acc=acc.endsWith(SEP)?acc+seg:acc+SEP+seg; out.push({name:seg,path:acc}); }
  return out;
}

let roots=[], treeCur=null;
async function loadRoots(){ roots=(await api.roots()).map(r=>({path:r.path,name:r.name,drive:r.drive,kids:null,open:false,up:null})); renderTree(); }
async function kidsOf(n){
  if(n.kids) return n.kids;

const under=(p,root)=>samePath(p,root)||(isMac?p:p.toLowerCase()).startsWith((isMac?root:root.toLowerCase()).replace(/[\\/]?$/,SEP));
async function syncTree(){
  treeCur=null;
  if(curPath){
    let best=null; for(const r of roots) if(under(curPath,r.path)&&(!best||r.path.length>best.path.length)) best=r;
    if(best){

function applyView(keepPath){
  const q=norm($('#q').value.trim());

    loadDeep().then(ok=>{ if(ok){ applyView(keepPath); prefetch(); } });
    if(!view.length) status('Wczytywanie podfolderów…');
    return;
  }
  heads=null;
  const ds=isDeep?[]:dirs.filter(d=>!q||norm(d.name).includes(q));
  const fs=(isDeep?deepItems:items).filter(it=>on(it.type)&&(!q||norm(isDeep?(it.rel+'/'+it.name):it.name).includes(q)));
  const d=S.dir, byName=(a,b)=>coll.compare(a.name,b.name);
  const by={
    name:(a,b)=>byName(a,b)*d,
    date:(a,b)=>(a.mtime-b.mtime)*d||byName(a,b),
    size:(a,b)=>(a.size-b.size)*d||byName(a,b),
    type:(a,b)=>a.type.localeCompare(b.type)*d||byName(a,b),
    dims:(a,b)=>((a.dims?a.dims[0]*a.dims[1]:0)-(b.dims?b.dims[0]*b.dims[1]:0))*d||byName(a,b)
  }[S.sort];
  fs.sort(by);
  if(S.sort==='name'&&d<0) ds.reverse();
  if(isDeep){ // grupy według podfolderów, najpierw sam folder
    const g=new Map(); for(const it of fs){ if(!g.has(it.rel)) g.set(it.rel,[]); g.get(it.rel).push(it); }
    const keys=[...g.keys()].sort((a,b)=>a===''?-1:b===''?1:coll.compare(a,b));
    view=[]; heads=new Map();
    for(const k of keys){ heads.set(view.length,{rel:k,count:g.get(k).length}); view.push(...g.get(k)); }
  } else view=[...ds,...fs];
  sel=keepPath?view.findIndex(it=>samePath(it.path,keepPath)):-1; anchor=sel;
  picked=new Set(sel>=0?[view[sel]]:[]);

}

/* --- foldery w siatce: okładka i przeglądanie zawartości ruchem myszy --- */
function resetDir(d){d.files=null;d.count=null;d.state=null;d._p=null;d.si=0;}
function loadDir(d,hi){
  if(d._p){ if(hi&&d.files&&d.files[0]) enqueue(d.files[0],true); return d._p; }
  d.state='loading';
  return d._p=(async()=>{
    const r=await api.list(d.path,EXTS);
    const all=r.files.map(f=>({kind:'file',name:f.name,path:f.path,size:f.size,mtime:f.mtime,type:EXT[extOf(f.name)],state:null,gen})).filter(f=>on(f.type));
    all.sort((a,b)=>coll.compare(a.name,b.name));
    d.count=all.length;
    d.files=all.length<=SKIM?all:Array.from({length:SKIM},(_,k)=>all[Math.floor(k*all.length/SKIM)]);
    d.si=0; d.state='done';
    if(d.files[0]){ d.files[0].cb=()=>paint(d); enqueue(d.files[0],hi||d.visible); }
    paint(d);
  })();
}
function paintDir(d){
  if(!d.tile||d.tile.tagName==='TR'){ if(d.tile) paint(d); return; }
  const box=d.tile.firstChild; box.textContent='';
  const f=d.files&&d.files[d.si||0];
  if(f&&f.thumb) box.appendChild(f.thumb);
  else{const s=document.createElement('span');s.className='ph';s.textContent=d.state==='done'&&!d.count?'∅':'';box.appendChild(s);}
  if(d.files&&d.files.length>1){
    const sk=document.createElement('div');sk.className='sk';
    for(let k=0;k<d.files.length;k++){const i=document.createElement('i');if(k===(d.si||0))i.className='on';sk.appendChild(i);}
    const cn=document.createElement('span');cn.className='cnt';cn.textContent=((d.si||0)+1)+'/'+d.files.length;
    box.append(sk,cn);
  }
}

/* --- kolejka miniatur: najpierw widoczne, potem w tle cały folder i okładki podfolderów --- */
const hiQ=[], loQ=[]; let running=0;
const MAXRUN=Math.min(6,Math.max(2,(navigator.hardwareConcurrency||4)-1));
function enqueue(it,hi,front){
  if(it.state==='done'||it.state==='loading'||it.state==='error'){ if(it.state==='done'&&it.cb){const c=it.cb;it.cb=null;c();} return; }
  if(it.state==='queued'){ if(hi&&!it.hi){it.hi=true;front?hiQ.unshift(it):hiQ.push(it);pump();} return; }
  it.state='queued'; it.hi=!!hi; (hi?(front?a=>hiQ.unshift(a):a=>hiQ.push(a)):a=>loQ.push(a))(it); pump();
}
function take(){
  while(hiQ.length){const x=hiQ.shift(); if(x.state==='queued'&&x.gen===gen) return x;}
  while(loQ.length){const x=loQ.shift(); if(x.state==='queued'&&x.gen===gen) return x;}
  return null;
}
function pump(){
  while(running<MAXRUN){
    const it=take(); if(!it) break;
    running++; it.state='loading';
    thumbOf(it).then(()=>{it.state='done';},e=>{it.state='error';it.err=e&&e.message||String(e);})
      .finally(()=>{running--;
        if(it.tile&&it.tile.isConnected) paint(it);
        if(it.cb){const c=it.cb;it.cb=null;c();}
        if(view[sel]===it) status();
        progress(); pump();});
  }
  progress();
}
async function prefetch(){
  const g=gen;
  for(const it of view) if(it.kind==='file') enqueue(it,false);
  for(const d of dirs){ if(g!==gen) return; await loadDir(d,false); }
}
let progT=0;
function progress(){
  if(progT) return;
  progT=requestAnimationFrame(()=>{progT=0;
    const total=items.length, done=items.filter(x=>x.state==='done'||x.state==='error').length;
    $('#prog').textContent=total&&done<total?'Miniatury: '+done+' / '+total:'';
  });
}
function thumbOf(it){ return it._tp||(it._tp=buildThumb(it)); }
async function buildThumb(it){
  const key={path:it.path,size:it.size,mtime:it.mtime};
  const hit=await api.thumbGet(key);
  if(hit){
    try{
      const b=await fetch(hit.url).then(x=>{if(!x.ok)throw 0;return x.blob();}).finally(()=>{if(hit.url.startsWith('blob:'))URL.revokeObjectURL(hit.url);});
      const bmp=await createImageBitmap(b);
      const c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;c.getContext('2d').drawImage(bmp,0,0);bmp.close();
      it.thumb=c; it.dims=hit.dims||it.dims; it.meta=hit.meta||it.meta; return;
    }catch(e){ api.thumbForget(hit.hash); }
  }
  let bmp;
  if(it.type==='svg'){const im=await loadImg(api.fileUrl(it.path));const w=im.naturalWidth||1024,h=im.naturalHeight||1024;
    const k=Math.min(4,TH*2/Math.max(w,h));const c=new OffscreenCanvas(Math.round(w*k),Math.round(h*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    bmp=c.transferToImageBitmap();it.dims=[w,h];}
  else if(NATIVE.has(it.type)){bmp=await createImageBitmap(await blobOf(it));it.dims=[bmp.width,bmp.height];}
  else{
    if(it.type==='psd'&&!it.thumb){ // od razu mała miniatura zapisana w PSD, potem ostra
      try{const q=await decode(ref(it),'psdthumb',0); const b=await toBitmap(q); const c=document.createElement('canvas');c.width=b.width;c.height=b.height;c.getContext('2d').drawImage(b,0,0);b.close();
        it.thumb=c; it.dims=[q.meta.width,q.meta.height]; it.meta=q.meta; if(it.tile&&it.tile.isConnected) paint(it);}catch(e){}
    }
    const r=await decode(ref(it),it.type,TH*2);it.meta=r.meta;it.dims=[r.meta.width,r.meta.height];bmp=await toBitmap(r);}
  const s=Math.min(1,TH/Math.max(bmp.width,bmp.height));
  const w=Math.max(1,Math.round(bmp.width*s)),h=Math.max(1,Math.round(bmp.height*s));
  const small=s<1?await createImageBitmap(bmp,{resizeWidth:w,resizeHeight:h,resizeQuality:'high'}):bmp;
  let c;
  if(OPAQUE.has(it.type)){c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(small,0,0);}
  else c=paintOn(small,w,h,Math.max(4,Math.round(Math.max(w,h)/48)));

  it.thumb=c;

let chkTile=null;
function paintOn(bmp,w,h,cell){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  if(!chkTile){chkTile=document.createElement('canvas');chkTile.width=chkTile.height=2;const t=chkTile.getContext('2d');t.fillStyle='#fff';t.fillRect(0,0,2,2);t.fillStyle='#d4d4d4';t.fillRect(1,0,1,1);t.fillRect(0,1,1,1);}

  g.fillStyle=p;g.fillRect(0,0,w,h);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';

/* --- wątki robocze do PSD, TIFF, EXR, HDR, TGA, RAW --- */
const pool=[], jobs=new Map(); let jobId=0, lib=null;
const direct=(r,t,m)=>(lib=lib||decoderLib()).decode(asFile(r),t,m);
try{
  const src='const asFile='+asFile.toString()+';const lib=('+decoderLib.toString()+')();self.onmessage=async e=>{const{id,file,type,max}=e.data;try{const r=await lib.decode(asFile(file),type,max);self.postMessage({id,r},r.data?[r.data.buffer]:[])}catch(err){self.postMessage({id,error:String(err&&err.message||err)})}}';
  const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
  for(let i=0;i<MAXRUN;i++){
    const w=new Worker(url); w.busy=0;
    w.onmessage=e=>{const j=jobs.get(e.data.id);if(!j)return;jobs.delete(e.data.id);w.busy--;e.data.error?j.rej(new Error(e.data.error)):j.res(e.data.r);};
    w.onerror=ev=>{ev.preventDefault();const k=pool.indexOf(w);if(k>=0)pool.splice(k,1);
      for(const [id,j] of jobs) if(j.w===w){jobs.delete(id);direct(j.f,j.t,j.m).then(j.res,j.rej);}};
    pool.push(w);
  }
}catch(e){}
function decode(f,t,m){
  if(!pool.length) return direct(f,t,m);
  const w=pool.reduce((a,b)=>a.busy<=b.busy?a:b); w.busy++;
  return new Promise((res,rej)=>{const id=++jobId;jobs.set(id,{res,rej,w,f,t,m});w.postMessage({id,file:f,type:t,max:m});});
}

/* --- podgląd powiększony: natychmiast miniatura, potem pełny obraz; sąsiedzi wczytywani z wyprzedzeniem --- */
const viewer=$('#viewer'), stage=$('#stage');
let vTok=0, vEl=null, actual=false, vList=[], vi=0, lastStep=0;
const vCache=new Map(); // pełne obrazy ostatnio oglądane i wczytane z wyprzedzeniem
const VC_PX=180e6;      // limit pamięci podglądów (w pikselach)
const bigCell=(w,h)=>Math.max(8,Math.round(Math.max(w,h)/80));
const vpx=v=>(v.el.naturalWidth||v.el.width)*(v.el.naturalHeight||v.el.height);
const vLoading=new Map();
function fullOf(it){
  if(vCache.has(it)){const v=vCache.get(it);vCache.delete(it);vCache.set(it,v);return Promise.resolve(v);}
  if(vLoading.has(it)) return vLoading.get(it);
  const p=(async()=>{
    let v;
    if(NATIVE.has(it.type)&&it.type!=='jpg'&&it.type!=='gif'&&it.type!=='svg'){
      const bmp=await createImageBitmap(await blobOf(it)); it.dims=[bmp.width,bmp.height];
      v={el:paintOn(bmp,bmp.width,bmp.height,bigCell(bmp.width,bmp.height)),note:''}; bmp.close();
    }else if(NATIVE.has(it.type)){
      const el=await loadImg(api.fileUrl(it.path));
      if(el.naturalWidth) it.dims=[el.naturalWidth,el.naturalHeight];
      if(it.type==='svg'&&!el.naturalWidth){el.style.width='80%';}
      v={el,note:''};
    }else{
      const r=await decode(ref(it),it.type,0);
      it.meta=r.meta; it.dims=[r.meta.width,r.meta.height];
      const bmp=await toBitmap(r); let el;
      if(OPAQUE.has(it.type)||r.jpeg){el=document.createElement('canvas');el.width=bmp.width;el.height=bmp.height;el.getContext('2d').drawImage(bmp,0,0);}
      else el=paintOn(bmp,bmp.width,bmp.height,bigCell(bmp.width,bmp.height));
      bmp.close(); v={el,note:r.note||''};
    }
    vCache.set(it,v);
    let tot=0; for(const x of vCache.values()) tot+=vpx(x);
    for(const k of vCache.keys()){ if(tot<=VC_PX||vCache.size<=2) break; if(vList[vi]===k) continue; tot-=vpx(vCache.get(k)); vCache.delete(k); }
    return v;
  })().finally(()=>vLoading.delete(it));
  vLoading.set(it,p); return p;
}
function openViewer(it){

function mount(el,low,it){

  el.classList.toggle('low',!!low);

}
async function showV(){
  const it=vList[vi]; if(!it) return; const tok=++vTok;

  $('#vname').textContent=it.name; $('#vname').title=it.path; $('#vinfo').textContent=info(it); $('#vcount').textContent=(vi+1)+' / '+vList.length;
  stage.className=actual?'actual':'fit';
  if(vCache.has(it)){ const v=await fullOf(it); if(tok!==vTok) return; mount(v.el,false,it); afterShow(it,v,tok); return; }
  // od razu: miniatura z pamięci
  if(it.thumb){ const c=document.createElement('canvas'); c.width=it.thumb.width; c.height=it.thumb.height; c.getContext('2d').drawImage(it.thumb,0,0); mount(c,true,it); }
  else { stage.innerHTML='<div class="msg">Wczytywanie…</div>'; vEl=null; enqueue(it,true,true); }
  // przy szybkim przewijaniu czekamy chwilę, zanim zaczniemy dekodować pełny plik
  if(fast){ await new Promise(r=>setTimeout(r,140)); if(tok!==vTok) return; }
  let v;
  try{v=await fullOf(it);}catch(e){if(tok===vTok&&!it.thumb){stage.innerHTML='<div class="msg"></div>';stage.firstChild.textContent='Nie udało się otworzyć: '+(e.message||e);}return;}

function afterShow(it,v,tok){
